<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#6C63FF"/>
<title>🏠 بيتنا</title>
<style>
/* ── CSS Variables ── */
:root{
  --primary:#6C63FF;--primary2:#a855f7;--secondary:#FF6584;
  --green:#00B894;--orange:#FA8231;--yellow:#FDCB6E;--blue:#0984E3;
  --bg:#F8F9FF;--bg2:#fff;--bg3:#f0f0f8;
  --text:#2d3436;--text2:#636e72;--text3:#b2bec3;
  --border:#eef0f5;--card-shadow:0 2px 16px rgba(0,0,0,.06);
  --radius:16px;--radius-sm:10px;--radius-lg:24px;
  --hdr-h:56px;--nav-h:60px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;
  --text:#e8e8f0;--text2:#a8a8c0;--text3:#606080;
  --border:#2a2a40;--card-shadow:0 2px 16px rgba(0,0,0,.3);
}

/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s}
input,select,textarea,button{font-family:inherit;direction:rtl;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── Layout ── */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.app-shell{display:flex;height:100%;overflow:hidden}
.sidebar{display:none;width:240px;min-width:240px;flex-shrink:0;
  height:100%;overflow:hidden;flex-direction:column;
  background:var(--bg2);border-left:1px solid var(--border);
  box-shadow:-2px 0 12px rgba(0,0,0,.08)}
.main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;min-width:0}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100%}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--nav-h) + var(--safe-bottom) + 10px)}

/* ── Desktop ── */
@media(min-width:900px){
  .sidebar{display:flex}
  .scroll{padding:20px 24px 40px}
  .mob-only{display:none!important}
  .bottom-nav{display:none!important}
}
@media(max-width:899px){
  .desk-only{display:none!important}
}

/* ── Top Header ── */
.hdr{display:flex;align-items:center;gap:10px;padding:0 14px;
  height:var(--hdr-h);flex-shrink:0;position:relative}
.hdr-grad{background:linear-gradient(135deg,var(--primary),var(--primary2))}
.hdr-dark{background:linear-gradient(135deg,#1a1a2e,#2d1b69)}
.hdr-title{color:#fff;font-size:16px;font-weight:800;flex:1;text-align:center}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;
  border-radius:var(--radius-sm);padding:8px 14px;font-size:20px;font-weight:900;
  cursor:pointer;flex-shrink:0;line-height:1}

/* ── Desktop Top Bar ── */
.desk-bar{display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;flex-shrink:0;background:var(--bg2);
  border-bottom:1px solid var(--border);gap:12px}
.desk-bar .breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.desk-bar .breadcrumb .current{color:var(--text);font-weight:700}
.desk-bar .actions{display:flex;gap:8px;align-items:center}

/* ── Bottom Nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:6px 0 var(--safe-bottom);z-index:100;
  box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;cursor:pointer;padding:5px 2px;
  color:var(--text3);font-size:10px;font-weight:600;position:relative;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-badge{position:absolute;top:0;right:calc(50% - 16px);
  background:var(--secondary);color:#fff;border-radius:10px;
  padding:1px 5px;font-size:9px;font-weight:900;border:1.5px solid var(--bg2)}

/* ── Cards ── */
.card{background:var(--bg2);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--card-shadow);border:1px solid var(--border)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* ── Buttons ── */
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;border:none;border-radius:var(--radius);padding:13px;width:100%;
  font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(108,99,255,.4);transition:all .2s}
.btn-primary:active{transform:scale(.98)}
.btn-sm{background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s}
.btn-icon{background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.btn-del{background:#FEE2E2;border:1.5px solid #fecaca;color:#EF4444;
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.btn-edit{background:#EEF2FF;border:1.5px solid #c7d2fe;color:var(--primary);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}

/* ── Form Fields ── */
.field-group{margin-bottom:12px}
.field-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px}
.field-input{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);
  outline:none;transition:border-color .2s;direction:rtl}
.field-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.field-textarea{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);
  outline:none;transition:border-color .2s;resize:none;font-family:inherit;direction:rtl}
.field-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.field-select{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);outline:none}

/* ── Chips ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:2px solid var(--border);border-radius:20px;padding:6px 14px;
  cursor:pointer;font-size:13px;font-weight:600;background:var(--bg2);color:var(--text);
  transition:all .2s;white-space:nowrap}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Pills ── */
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700}

/* ── Progress Bar ── */
.pbar{background:var(--bg3);border-radius:10px;overflow:hidden}
.pbar-fill{border-radius:10px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ── Chat ── */
.chat-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.mine{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;flex-shrink:0;margin-bottom:2px}
.msg-bubble{max-width:70%;padding:9px 13px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-bubble.mine{background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;border-radius:18px 18px 4px 18px}
.msg-bubble.theirs{background:var(--bg2);color:var(--text);
  border-radius:18px 18px 18px 4px;box-shadow:var(--card-shadow);border:1px solid var(--border)}
.msg-time{font-size:9px;opacity:.6;margin-top:3px;display:block}
.msg-name{font-size:10px;font-weight:700;opacity:.7;margin-bottom:2px}
.date-sep{text-align:center;margin:8px 0}
.date-sep span{background:var(--bg3);color:var(--text3);font-size:11px;
  font-weight:600;padding:3px 12px;border-radius:12px}
.chat-bar{background:var(--bg2);border-top:1px solid var(--border);
  padding:8px 12px calc(8px + var(--safe-bottom));flex-shrink:0}
.chat-input-row{display:flex;align-items:flex-end;gap:8px;
  background:var(--bg3);border-radius:24px;padding:6px 8px 6px 14px}
.chat-field{flex:1;background:none;border:none;outline:none;font-size:15px;
  font-family:inherit;direction:rtl;max-height:100px;min-height:22px;
  resize:none;color:var(--text);line-height:1.5}
.chat-send{width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(108,99,255,.4)}
.chat-emoji-btn{background:none;border:none;font-size:20px;cursor:pointer;opacity:.5;padding:2px}
.sender-row{display:flex;gap:4px;margin-bottom:8px;background:var(--bg3);
  border-radius:14px;padding:4px;overflow-x:auto}
.sender-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:10px;border:none;cursor:pointer;
  font-size:12px;font-weight:700;background:transparent;color:var(--text2);transition:all .2s}
.sender-btn.active{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.quick-row{display:flex;gap:5px;overflow-x:auto;padding:6px 0;margin-bottom:6px;scrollbar-width:none}
.quick-chip{flex:0 0 auto;background:var(--primary)15;border:1.5px solid var(--primary)30;
  border-radius:20px;padding:5px 11px;cursor:pointer;font-size:11px;
  font-weight:600;color:var(--primary);white-space:nowrap}

/* ── Sidebar ── */
.sb-logo{padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px}
.sb-logo-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.sb-nav{padding:8px}
.sb-nav-btn{display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border:none;border-radius:var(--radius);
  background:transparent;color:var(--text2);cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s;margin-bottom:2px;position:relative}
.sb-nav-btn:hover{background:var(--bg3);color:var(--text)}
.sb-nav-btn.active{background:rgba(108,99,255,.12);color:var(--primary)}
.sb-nav-btn .sb-icon{font-size:16px;flex-shrink:0}
.sb-children{padding:8px;flex:1;overflow-y:auto}
.sb-child-btn{display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border:2px solid transparent;border-radius:var(--radius);
  background:transparent;cursor:pointer;margin-bottom:4px;transition:all .2s}
.sb-child-btn:hover{background:var(--bg3)}
.sb-child-btn.active{background:var(--primary)12;border-color:var(--primary)40}
.sb-child-avatar{width:32px;height:32px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sb-child-name{font-size:12px;font-weight:700;color:var(--text);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-child-grade{font-size:10px;color:var(--text3)}

/* ── Tabs ── */
.tabs{display:flex;background:var(--bg3);padding:0 4px;flex-shrink:0;
  border-bottom:2px solid var(--border);overflow-x:auto}
.tab-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;border:none;background:transparent;cursor:pointer;
  color:var(--text3);font-size:13px;font-weight:600;transition:all .2s;
  border-bottom:3px solid transparent;position:relative}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:rgba(108,99,255,.06)}
.tab-btn .tab-icon{font-size:16px;line-height:1}
.tab-btn .tab-label{font-size:9px;font-weight:700;white-space:nowrap}

/* ── Toast ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);
  color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:700;
  z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;
  animation:toastIn .3s ease}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── Confirm ── */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.confirm-box{background:var(--bg2);border-radius:var(--radius-lg);padding:24px;
  max-width:300px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}

/* ── Login ── */
.login-screen{height:100%;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#1a1a2e 0%,var(--primary) 100%);
  align-items:center;justify-content:center;padding:24px}
.login-box{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-lg);
  padding:32px 24px;width:100%;max-width:360px}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 8px;
  text-align:center;border-top:3px solid transparent;box-shadow:var(--card-shadow)}
.stat-val{font-size:20px;font-weight:900;line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px}

/* ── Section Title ── */
.sec-title{font-size:11px;font-weight:800;color:var(--text3);
  margin-bottom:8px;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}

/* ── Child Header ── */
.child-hdr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 14px 14px;flex-shrink:0}
.child-hdr-emoji{font-size:36px;margin-top:4px}
.child-hdr-name{color:#fff;font-size:18px;font-weight:900}
.child-hdr-grade{color:rgba(255,255,255,.75);font-size:12px}
.child-hdr-pills{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}

/* ── Pull to refresh indicator ── */
.ptr-bar{position:fixed;top:0;left:0;right:0;height:0;background:var(--primary);
  transition:height .2s;z-index:9990;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:13px;font-weight:700;overflow:hidden}

/* ── Emoji Picker ── */
.emoji-picker{position:fixed;background:var(--bg2);border-radius:var(--radius);
  padding:10px;box-shadow:0 8px 32px rgba(0,0,0,.2);z-index:999;
  display:flex;flex-wrap:wrap;gap:3px;width:230px;max-height:180px;overflow-y:auto;
  border:1px solid var(--border)}
.e-btn{background:none;border:none;font-size:21px;cursor:pointer;padding:3px;border-radius:6px}
.e-btn:hover{background:var(--bg3)}

/* ── Notification badge ── */
.notif-badge{position:absolute;top:-2px;right:-4px;background:var(--secondary);
  color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:900;
  border:2px solid var(--bg2);pointer-events:none}

/* ── Swipe hint ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ── AI ── */
.ai-card{background:linear-gradient(135deg,#1a1a2e,#2d1b69);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;color:#fff;border:1px solid rgba(108,99,255,.3)}
.ai-badge{background:rgba(108,99,255,.3);color:#a78bfa;padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:8px}

/* ── Print ── */
@media print{
  .no-print,.sidebar,.desk-bar,.bottom-nav,.hdr .back-btn,.tabs,
  .btn-primary,.btn-sm,.btn-del,.btn-edit,.chat-bar,.sender-row,.quick-row{display:none!important}
  body{overflow:auto!important;background:#fff!important;color:#000!important}
  #app,.app-shell,.main,.screen{height:auto!important;overflow:visible!important;display:block!important}
  .scroll{overflow:visible!important;padding:0!important;height:auto!important}
  .card{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid}
  @page{margin:1.5cm;size:A4 portrait}
}
</style>
</head>

async function apiLoad(){
  const r=await fetch(`https://api.jsonbin.io/v3/b/${CFG.BIN_ID}/latest`,{headers:{"X-Master-Key":CFG.API_KEY}});
  if(!r.ok)throw new Error("load failed");
  const j=await r.json();
  if(!j.record?.children)return DEF;
  let d=j.record;
  // Migration
  if(d.children&&d.children[0]){
    const nm={"أحمد":"Adam","سارة":"Jasmine","محمد":"Asser"};
    const gm={"الصف الرابع":"Primary 5","الصف السادس":"Primary 1","الصف الأول":"Pre KG"};
    if(nm[d.children[0].name]){
      d={...d,children:d.children.map(c=>({...c,name:nm[c.name]||c.name,grade:gm[c.grade]||c.grade}))};
    }
  }
  // Ensure users array exists
  if(!d.users)d={...d,users:DEF.users};
  // Ensure new fields
  if(!d.homeRequests)d={...d,homeRequests:DEF.homeRequests};
  if(!d.homePlans)d={...d,homePlans:DEF.homePlans};
  if(!d.generalChat)d={...d,generalChat:DEF.generalChat};
  if(!d.notifications)d={...d,notifications:DEF.notifications};
  if(!d.parentSettings)d={...d,parentSettings:DEF.parentSettings};
  if(!d.aiSuggestions)d={...d,aiSuggestions:[]};
  return d;
}

async function apiSave(data){
  await fetch(`https://api.jsonbin.io/v3/b/${CFG.BIN_ID}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":CFG.API_KEY},
    body:JSON.stringify(data)
  });
}

function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else if(k==="innerHTML")e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  kids.flat(Infinity).forEach(k=>{
    if(k==null||k===false||k===undefined)return;
    e.appendChild(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);
  });
  return e;
}

function buildChat({msgs,allUsers,currentUserName,color,onSend,quickActions,placeholder,focusId}){
  const wrap=div({className:"chat-wrap"});
  const msgArea=div({className:"chat-msgs"});

  if(!msgs.length){
    msgArea.appendChild(div({style:{textAlign:"center",padding:"40px 20px",color:"var(--text3)"}},
      div({style:{fontSize:"48px",marginBottom:"12px"}},"💬"),
      div({style:{fontSize:"14px",fontWeight:"600"}},"ابدأ المحادثة"),
      div({style:{fontSize:"12px",marginTop:"4px"}},"مزامنة فورية بين الأجهزة")
    ));
  }

  let lastDate="";
  msgs.forEach((m,i)=>{
    if(m.date!==lastDate){
      lastDate=m.date;
      const lbl=m.date===todayStr?"اليوم":m.date;
      msgArea.appendChild(div({className:"date-sep"},span(null,lbl)));
    }
    const isMine=m.sender===currentUserName;
    const prev=i>0?msgs[i-1]:null;
    const showAv=!prev||prev.sender!==m.sender;
    const row=div({className:"msg-row"+(isMine?" mine":"")});
    // Avatar
    const avEl=div({className:"msg-avatar",style:{background:isMine?color+"20":"var(--bg3)",opacity:showAv?"1":"0"}},showAv?m.avatar:"");
    row.appendChild(avEl);
    // Content
    const bWrap=div({style:{display:"flex",flexDirection:"column",alignItems:isMine?"flex-end":"flex-start",maxWidth:"70%"}});
    if(showAv&&!isMine)bWrap.appendChild(div({className:"msg-name",style:{color:color||"var(--primary)"}},m.sender));
    const bubble=div({className:"msg-bubble "+(isMine?"mine":"theirs")});
    // Child ref
    if(m.childId||m.childRef){
      const c=(S().data?.children||[]).find(c2=>c2.id===(m.childId||m.childRef));
      if(c)bubble.appendChild(div({style:{fontSize:"10px",fontWeight:"700",opacity:".8",marginBottom:"4px",borderBottom:"1px solid rgba(255,255,255,.2)",paddingBottom:"3px"}},c.emoji+" "+c.name));
    }
    bubble.appendChild(span(null,m.text));
    bubble.appendChild(span({className:"msg-time",style:{textAlign:isMine?"left":"right"}},m.time));
    bWrap.appendChild(bubble);
    row.appendChild(bWrap);
    msgArea.appendChild(row);
  });

  wrap.appendChild(msgArea);

  // ── Input Bar ──
  const bar=div({className:"chat-bar no-print"});

  // Sender switcher
  const sRow=div({className:"sender-row"});
  allUsers.forEach(u=>{
    const isMe=u.name===currentUserName;
    const sb=btn({className:"sender-btn"+(isMe?" active":""),onclick:()=>{
      try{localStorage.setItem("chatUser",u.name);}catch(e){}
      const cu=S().currentUser;
      if(cu&&(cu.role==="admin"||cu.role==="parent")){
        render();
      }
    }},span({style:{fontSize:"16px"}},u.avatar),span(null,u.name));
    sRow.appendChild(sb);
  });
  bar.appendChild(sRow);

  // Quick chips
  if(quickActions?.length){
    const qr=div({className:"quick-row"});
    quickActions.forEach(qa=>{
      qr.appendChild(btn({className:"quick-chip",style:{borderColor:color+"40",color},onclick:()=>{
        const now=new Date();
        const curU=allUsers.find(u=>u.name===currentUserName)||allUsers[0];
        onSend({text:qa.text,childId:qa.childId||null,sender:curU.name,avatar:curU.avatar});
      }},qa.label));
    });
    bar.appendChild(qr);
  }

  // Input row
  const inputRow=div({className:"chat-input-row"});
  // Emoji btn
  const eBtn=btn({className:"chat-emoji-btn",onclick:(ev)=>{
    ev.stopPropagation();
    // Remove existing picker
    const old=document.querySelector(".emoji-picker");
    if(old){old.remove();return;}
    const rect=eBtn.getBoundingClientRect();
    const picker=div({className:"emoji-picker"});
    picker.style.bottom=(window.innerHeight-rect.top+8)+"px";
    picker.style.right=(window.innerWidth-rect.right+rect.width/2-115)+"px";
    [...`😀😂🥰😊🤗😎👍👏🙏❤️💪✅⭐🎉🔥💯📚✏️📝🏆🎯💡⏰📅🍕🎮⚽🎨🌟😴🤔😅😘🥳🤩💐🙌🫡🫶📢🔔⚠️🌙☀️🌈`].forEach(em=>{
      picker.appendChild(btn({className:"e-btn",onclick:(e)=>{e.stopPropagation();tf.value+=em;tf.focus();}},em));
    });
    document.body.appendChild(picker);
    const close=()=>{picker.remove();document.removeEventListener("click",close);};
    setTimeout(()=>document.addEventListener("click",close),10);
  }},"😊");
  inputRow.appendChild(eBtn);

  const tf=textarea({"data-fid":focusId||"chat",className:"chat-field",placeholder:placeholder||"اكتب رسالة...",rows:1});
  tf.oninput=function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,100)+"px";};
  tf.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>=900){e.preventDefault();send();}};
  inputRow.appendChild(tf);

  const sendBtn=btn({className:"chat-send",onclick:()=>send()},"↑");
  inputRow.appendChild(sendBtn);
  bar.appendChild(inputRow);
  wrap.appendChild(bar);

  function send(){
    const t=(tf.value||"").trim();if(!t)return;
    const now=new Date();
    const curU=allUsers.find(u=>u.name===currentUserName)||allUsers[0];
    onSend({text:t,childId:null,sender:curU.name,avatar:curU.avatar});
    tf.value="";tf.style.height="auto";tf.focus();
    setTimeout(()=>{msgArea.scrollTop=msgArea.scrollHeight;},80);
  }

  setTimeout(()=>{msgArea.scrollTop=msgArea.scrollHeight;},60);
  return wrap;
}

function screenLogin(){
  const {data,pinInput,loginError}=S();
  if(!data)return div({className:"login-screen"},
    div({style:{textAlign:"center",color:"#fff"}},
      div({style:{fontSize:"60px"}},"🏠"),
      div({style:{fontSize:"28px",fontWeight:"900",marginTop:"12px"}}),"بيتنا",
      div({style:{fontSize:"14px",opacity:".7",marginTop:"8px"}},"جاري التحميل...")
    )
  );

  const users=data.users||DEF.users;
  const page=div({className:"login-screen"});

  const box=div({className:"login-box"});
  box.appendChild(div({style:{textAlign:"center",marginBottom:"24px"}},
    div({style:{fontSize:"48px"}},"🏠"),
    div({style:{fontSize:"24px",fontWeight:"900",color:"#fff",marginTop:"8px"}},"بيتنا"),
    div({style:{fontSize:"13px",color:"rgba(255,255,255,.7)",marginTop:"4px"}},"من أنت؟")
  ));

  // User selection
  const userGrid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"16px"}});
  users.filter(u=>u.active!==false).forEach(u=>{
    const isSelected=S().selectedLoginUser?.id===u.id;
    const ub=btn({
      style:{background:isSelected?"rgba(108,99,255,.6)":"rgba(255,255,255,.1)",border:isSelected?"2px solid rgba(108,99,255,.8)":"2px solid rgba(255,255,255,.1)",borderRadius:"14px",padding:"12px 8px",cursor:"pointer",transition:"all .2s",display:"flex",flexDirection:"column",alignItems:"center",gap:"4px"},
      onclick:()=>{ST.selectedLoginUser=u;ST.pinInput="";ST.loginError="";render();}
    },
      div({style:{fontSize:"28px"}},(u.avatar||"👤")),
      div({style:{fontSize:"13px",fontWeight:"700",color:"#fff"}},(u.name)),
      div({style:{fontSize:"10px",color:"rgba(255,255,255,.6)"}},(ROLES[u.role]?.l||u.role))
    );
    userGrid.appendChild(ub);
  });
  box.appendChild(userGrid);

  // PIN input
  if(S().selectedLoginUser){
    box.appendChild(div({style:{marginBottom:"12px",textAlign:"center",color:"rgba(255,255,255,.8)",fontSize:"13px"}},
      "أدخل PIN لـ "+S().selectedLoginUser.name
    ));
    const pinRow=div({style:{display:"flex",justifyContent:"center",gap:"8px",marginBottom:"12px"}});
    for(let i=0;i<4;i++){
      pinRow.appendChild(div({style:{width:"44px",height:"48px",borderRadius:"12px",background:"rgba(255,255,255,.1)",border:"2px solid rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"24px",color:"#fff",fontWeight:"900"}},
        pinInput.length>i?"●":""
      ));
    }
    box.appendChild(pinRow);
    // Number pad
    const pad=div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}});
    [1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(k=>{
      if(k===""){pad.appendChild(div());return;}
      const pb=btn({
        style:{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.15)",borderRadius:"12px",padding:"14px",color:"#fff",fontSize:k==="⌫"?"20px":"22px",fontWeight:"700",cursor:"pointer",transition:"all .15s"},
        onclick:()=>{
          if(k==="⌫"){ST.pinInput=ST.pinInput.slice(0,-1);ST.loginError="";}
          else if(ST.pinInput.length<4)ST.pinInput+=k;
          if(ST.pinInput.length===4){
            const u=ST.selectedLoginUser;
            if(ST.pinInput===(u.pin||"0000")){
              ST.currentUser=u;ST.pinInput="";ST.loginError="";ST.selectedLoginUser=null;
              try{localStorage.setItem("currentUserId",u.id);}catch(e){}
              setState({screen:"home"});
            } else {
              ST.loginError="PIN خطأ، حاول مرة أخرى";ST.pinInput="";
            }
          }
          render();
        }
      },String(k));
      pad.appendChild(pb);
    });
    box.appendChild(pad);
    if(loginError){
      box.appendChild(div({style:{textAlign:"center",color:"#FF6584",fontSize:"13px",fontWeight:"700",marginTop:"10px"}},loginError));
    }
  }

  page.appendChild(box);
  // Quick login hint
  page.appendChild(div({style:{color:"rgba(255,255,255,.4)",fontSize:"11px",textAlign:"center",marginTop:"12px"}},"Admin PIN: 1234"));
  return page;
}

  const {children,homework,notifications=[],homeRequests=[],parentSettings={}}=data;

  // Logo
  const logo=div({className:"sb-logo"});
  logo.appendChild(div({className:"sb-logo-title"},"🏠 بيتنا"));
  logo.appendChild(div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"4px"}},syncDot(),div({style:{position:"relative",cursor:"pointer"},onclick:()=>setState({screen:"notifications"})},span({style:{fontSize:"16px",color:"rgba(255,255,255,.7)"}},"🔔"),uc>0?span({style:{position:"absolute",top:"-4px",right:"-6px",background:"#FF6584",color:"#fff",borderRadius:"10px",padding:"1px 4px",fontSize:"9px",fontWeight:"900",border:"1.5px solid var(--primary)"}},String(uc)):null)));

  const isChild=["child","fHw","fExam","fGrade","fNote","fStudy","fGoal","fSupply","fAllowance","fPoints"].includes(screen);

  [["🏠","الرئيسية","home",isHome,0],["🏡","بيتنا","homeManage",isBeytna,pr],["💬","شات الأسرة","generalChat",screen==="generalChat",0],["📄","التقارير","reports",screen==="reports",0],["🔔","الإشعارات","notifications",screen==="notifications",uc],["⚙️","الإعدادات","settings",["settings","parentSetup","addChild","editChild"].includes(screen),0]].forEach(([icon,lbl,sc2,active,badge])=>{
    const b=btn({className:"sb-nav-btn"+(active?" active":""),onclick:()=>setState({screen:sc2})},
      span({className:"sb-icon"},icon),

    if(pending>0)cb.appendChild(div({style:{background:c.color,color:"#fff",borderRadius:"10px",padding:"2px 7px",fontSize:"10px",fontWeight:"700",flexShrink:0}},String(pending)));
    cl.appendChild(cb);
  });
  if(can("edit"))cl.appendChild(btn({style:{width:"100%",background:"rgba(108,99,255,.08)",color:"var(--primary)",border:"1.5px dashed rgba(108,99,255,.3)",borderRadius:"var(--radius)",padding:"8px",cursor:"pointer",fontSize:"12px",fontWeight:"600",marginTop:"6px"},onclick:()=>setState({childF:{name:"",grade:"",color:PALETTE[0],emoji:EMOJIS[0]},screen:"addChild"})},"+ إضافة طفل"));
  sb.appendChild(cl);

  // Current user at bottom
  const cu=S().currentUser;
  if(cu){
    const uBar=div({style:{padding:"10px 12px",borderTop:"1px solid var(--border)",display:"flex",alignItems:"center",gap:"8px"}});
    uBar.appendChild(div({style:{width:"32px",height:"32px",borderRadius:"50%",background:"var(--primary)18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px"}},cu.avatar||"👤"));
    uBar.appendChild(div({style:{flex:1,minWidth:0}},div({style:{fontSize:"13px",fontWeight:"700",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},cu.name),div({style:{fontSize:"10px",color:"var(--text3)"}},ROLES[cu.role]?.l||cu.role)));
    uBar.appendChild(btn({style:{background:"none",border:"none",cursor:"pointer",fontSize:"16px",opacity:".5"},onclick:()=>{ST.currentUser=null;try{localStorage.removeItem("currentUserId");}catch(e){}setState({screen:"login"});}},"🚪"));

function buildBottomNav(screen,data){
  const uc=unreadCount();const pr=pendingRequests();
  const nav=div({className:"bottom-nav mob-only no-print"});
  const mk=(icon,lbl,sc2,badge)=>{
    const isAct=sc2==="home"?["home","fEvent"].includes(screen):sc2==="homeManage"?["homeManage","fHomeRequest","fHomePlan"].includes(screen):sc2==="generalChat"?screen===sc2:sc2==="reports"?screen===sc2:sc2==="notifications"?screen===sc2:false;
    const b=btn({className:"nav-item"+(isAct?" active":""),onclick:()=>{if(sc2==="home")setState({screen:"home"});else setState({screen:sc2});}});
    const iw=div({style:{position:"relative",display:"inline-flex"}});
    iw.appendChild(div({className:"nav-icon"},icon));
    if(badge>0)iw.appendChild(span({className:"nav-badge"},String(badge)));
    b.appendChild(iw);

  nav.appendChild(mk("🏠","الرئيسية","home",0));

// ═══════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════
function render(){
  const {data,sync,screen,toast,confirm,currentUser}=S();
  const app=document.getElementById("app");
  app.innerHTML="";
  app.style.cssText="height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden";

  // Confirm dialog
  if(confirm){
    const bg=div({className:"confirm-bg"});
    const box=div({className:"confirm-box"});
    box.appendChild(div({style:{fontSize:"36px",marginBottom:"10px"}},"🗑️"));
    box.appendChild(div({style:{fontSize:"16px",fontWeight:"800",marginBottom:"6px"}},"تأكيد الحذف"));
    box.appendChild(div({style:{fontSize:"14px",color:"var(--text2)",marginBottom:"20px",lineHeight:"1.6"}},confirm.msg));
    box.appendChild(div({style:{display:"flex",gap:"8px"}},
      btn({className:"btn-sm",style:{flex:1,padding:"12px"},onclick:()=>setState({confirm:null})},"إلغاء"),
      btn({style:{flex:1,padding:"12px",background:"linear-gradient(135deg,#FF6584,#ff4757)",color:"#fff",border:"none",borderRadius:"var(--radius)",fontWeight:"700",cursor:"pointer"},onclick:()=>{const fn=S().confirm?.fn;setState({confirm:null});if(fn)fn();showToast("تم الحذف","warn");}},"حذف")
    ));
    bg.appendChild(box);app.appendChild(bg);
  }

  // Loading state
  if(!data){
    app.appendChild(div({style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:"16px",background:"linear-gradient(135deg,#1a1a2e,#6C63FF)"}},
      div({style:{fontSize:"56px"}},"🏠"),
      div({style:{fontSize:"22px",fontWeight:"900",color:"#fff"}},"بيتنا"),
      div({style:{color:"rgba(255,255,255,.6)",fontSize:"14px"}},"جاري التحميل..."),
      div({style:{display:"flex",gap:"6px",marginTop:"8px"}},
        ...[0,1,2].map(i=>span({style:{width:"10px",height:"10px",borderRadius:"50%",background:"rgba(255,255,255,.4)",display:"inline-block"}}))
      )
    ));
    return;
  }

  // Login screen (no shell)
  if(screen==="login"){
    app.appendChild(screenLogin());
    return;
  }

  // If not logged in, go to login
  if(!currentUser){
    // Try restore from localStorage
    try{
      const uid=localStorage.getItem("currentUserId");
      if(uid){const u=(data.users||[]).find(x=>x.id===uid);if(u){ST.currentUser=u;}}
    }catch(e){}
    if(!ST.currentUser){setState({screen:"login"});return;}
  }

  // Screen map
  const screens={
    home:screenHome,settings:screenSettings,reports:screenReports,child:screenChild,
    parentSetup:screenParentSetup,generalChat:screenGeneralChat,notifications:screenNotifications,
    homeManage:screenHomeManage,addChild:screenChildForm,editChild:screenChildForm,
    fHw:screenFHw,fExam:screenFExam,fGrade:screenFGrade,fNote:screenFNote,
    fStudy:screenFStudy,fGoal:screenFGoal,fSupply:screenFSupply,
    fAllowance:screenFAllowance,fPoints:screenFPoints,fEvent:screenFEvent,
    fHomeRequest:screenFHomeRequest,fHomePlan:screenFHomePlan,
  };
  const fn=screens[screen]||screenHome;
  const screenEl=fn();

  const isDesktop=window.innerWidth>=900;
  if(isDesktop){
    const shell=div({className:"app-shell"});
    shell.appendChild(buildSidebar(data));
    const main=div({className:"main"});
    main.appendChild(buildDesktopTopBar(data));
    const sw=div({style:{flex:"1",display:"flex",flexDirection:"column",overflow:"hidden",minHeight:"0"}});
    sw.appendChild(screenEl);
    main.appendChild(sw);
    shell.appendChild(main);
    app.appendChild(shell);
  } else {
    const wrap=div({style:{display:"flex",flexDirection:"column",height:"100%",height:"100dvh",overflow:"hidden",position:"relative"}});
    wrap.appendChild(screenEl);
    wrap.appendChild(buildBottomNav(screen,data));
    app.appendChild(wrap);
  }
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
// Restore theme
try{const t=localStorage.getItem("theme");if(t)document.body.setAttribute("data-theme",t);}catch(e){}

// Restore logged-in user (handled in render)

// Start
loadData();
setInterval(loadData,25000);
window.addEventListener("resize",()=>render());

// Pull to refresh
let ptrY=null,ptrEl2=null;
document.addEventListener("touchstart",e=>{if(e.touches[0].clientY<100&&window.scrollY<=0)ptrY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchmove",e=>{
  if(ptrY===null)return;
  if(e.touches[0].clientY-ptrY>70&&!ptrEl2){
    ptrEl2=div({style:{position:"fixed",top:"0",left:"50%",transform:"translateX(-50%)",background:"var(--primary)",color:"#fff",padding:"8px 20px",borderRadius:"0 0 16px 16px",fontSize:"13px",fontWeight:"700",zIndex:"9990",display:"flex",gap:"6px",alignItems:"center"}});
    ptrEl2.appendChild(span(null,"↻"));ptrEl2.appendChild(span(null,"سحب للتحديث"));
    document.body.appendChild(ptrEl2);
  }
},{passive:true});
document.addEventListener("touchend",()=>{
  if(ptrY!==null&&ptrEl2){ptrEl2.remove();ptrEl2=null;loadData();showToast("🔄 يتم التحديث...","ok");}
  ptrY=null;
},{passive:true});

// Swipe navigation between main screens
let swX=null,swY=null;
const SWIPE_SCREENS=["home","homeManage","generalChat","reports","notifications"];
document.addEventListener("touchstart",e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(swX===null)return;
  const dx=e.changedTouches[0].clientX-swX;
  const dy=Math.abs(e.changedTouches[0].clientY-swY);
  swX=null;swY=null;
  if(Math.abs(dx)<70||dy>50)return;
  const cur=S().screen;
  const idx=SWIPE_SCREENS.indexOf(cur);
  if(idx<0)return;
  if(dx>0&&idx>0)setState({screen:SWIPE_SCREENS[idx-1]});
  else if(dx<0&&idx<SWIPE_SCREENS.length-1)setState({screen:SWIPE_SCREENS[idx+1]});
},{passive:true});

</script>
