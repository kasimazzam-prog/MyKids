<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#6C63FF"/>
<title>🏠 بيتنا</title>
<style>
:root{
  --primary:#6C63FF;--primary2:#a855f7;--secondary:#FF6584;
  --green:#00B894;--orange:#FA8231;--yellow:#FDCB6E;--blue:#0984E3;
  --bg:#F8F9FF;--bg2:#fff;--bg3:#f0f0f8;
  --text:#2d3436;--text2:#636e72;--text3:#b2bec3;
  --border:#eef0f5;--card-shadow:0 2px 16px rgba(0,0,0,.06);
  --radius:16px;--radius-sm:10px;--radius-lg:24px;
  --hdr-h:56px;--nav-h:58px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{--chat-bg:#0b141a;
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;
  --text:#e8e8f0;--text2:#a8a8c0;--text3:#606080;
  --border:#2a2a40;--card-shadow:0 2px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;direction:rtl;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s}
input,select,textarea,button{font-family:inherit;direction:rtl;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.app-shell{display:flex;height:100%;overflow:hidden}
.sidebar{display:none;width:240px;min-width:240px;flex-shrink:0;
  height:100%;overflow:hidden;flex-direction:column;
  background:var(--bg2);border-left:1px solid var(--border);
  box-shadow:-2px 0 12px rgba(0,0,0,.08)}
.main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;min-width:0}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100%}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 16px}
@media(min-width:900px){
  .sidebar{display:flex}
  .scroll{padding:20px 24px 40px}
  .mob-only{display:none!important}
  .bottom-nav{display:none!important}
}
@media(max-width:899px){
  .desk-only{display:none!important}
}
.hdr{display:flex;align-items:center;gap:10px;padding:var(--safe-top) 14px 0;
  height:calc(var(--hdr-h) + var(--safe-top));flex-shrink:0;position:relative;box-sizing:content-box}
.hdr-grad{background:linear-gradient(135deg,var(--primary),var(--primary2))}
.hdr-dark{background:linear-gradient(135deg,#1a1a2e,#2d1b69)}
.hdr-title{color:#fff;font-size:16px;font-weight:800;flex:1;text-align:center}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;
  border-radius:var(--radius-sm);padding:8px 14px;font-size:20px;font-weight:900;
  cursor:pointer;flex-shrink:0;line-height:1}
.desk-bar{display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;flex-shrink:0;background:var(--bg2);
  border-bottom:1px solid var(--border);gap:12px}
.desk-bar .breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.desk-bar .breadcrumb .current{color:var(--text);font-weight:700}
.desk-bar .actions{display:flex;gap:8px;align-items:center}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:5px 0 var(--safe-bottom);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;padding:5px 1px;color:var(--text3);font-size:8.5px;font-weight:600;position:relative;transition:color .2s;min-width:0}
.nav-item.active{color:var(--primary)}
.nav-item .nav-icon{font-size:18px;line-height:1}
.nav-badge{position:absolute;top:0;right:calc(50% - 16px);
  background:var(--secondary);color:#fff;border-radius:10px;
  padding:1px 5px;font-size:9px;font-weight:900;border:1.5px solid var(--bg2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;backdrop-filter:blur(2px)}
.modal-box{background:var(--bg2);border-radius:var(--radius);padding:22px;max-width:340px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3);border:1px solid var(--border)}
@media(max-width:899px){
  .scroll{padding-bottom:74px}
}
.card{background:var(--bg2);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--card-shadow);border:1px solid var(--border)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;border:none;border-radius:var(--radius);padding:13px;width:100%;
  font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(108,99,255,.4);transition:all .2s}
.btn-primary:active{transform:scale(.98)}
.btn-sm{background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s}
.btn-icon{background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.btn-del{background:#FEE2E2;border:1.5px solid #fecaca;color:#EF4444;
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.btn-edit{background:#EEF2FF;border:1.5px solid #c7d2fe;color:var(--primary);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.field-group{margin-bottom:12px}
.field-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px}
.field-input{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);
  outline:none;transition:border-color .2s;direction:rtl}
.field-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.field-textarea{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);
  outline:none;transition:border-color .2s;resize:none;font-family:inherit;direction:rtl}
.field-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.field-select{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:2px solid var(--border);border-radius:20px;padding:6px 14px;
  cursor:pointer;font-size:13px;font-weight:600;background:var(--bg2);color:var(--text);
  transition:all .2s;white-space:nowrap}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700}
.pbar{background:var(--bg3);border-radius:10px;overflow:hidden}
.pbar-fill{border-radius:10px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.chat-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:var(--chat-bg,#e5ddd5)}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.msg-row{display:flex;gap:6px;align-items:flex-end;margin-bottom:2px;padding:0 2px}
.msg-row.mine{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-bottom:2px}
.bubble-txt{display:inline}
.msg-bubble{padding:6px 9px 5px;font-size:14.5px;line-height:1.4;word-break:break-word;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.13);position:relative}
.msg-bubble.mine{background:#DCF8C6;color:#111;border-bottom-right-radius:3px}
.msg-bubble.theirs{background:var(--bg2);color:var(--text);border-bottom-left-radius:3px}
.msg-time{display:block;font-size:10px;color:#667;text-align:left;margin-top:1px;line-height:1;float:left;margin-right:8px}
.msg-name{font-size:10px;font-weight:700;opacity:.7;margin-bottom:2px}
.mention-tag{color:var(--primary);font-weight:800;background:rgba(108,99,255,.12);border-radius:6px;padding:0 3px}
.msg-bubble.mine .mention-tag{color:#0a7a3f;background:rgba(10,122,63,.12)}
.mention-popup{position:absolute;bottom:100%;left:8px;right:8px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:200px;overflow-y:auto;margin-bottom:6px;z-index:1200}
.mention-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.mention-opt:active,.mention-opt.sel{background:var(--bg3)}
.mention-opt .m-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.date-sep{align-self:center;margin:10px 0 6px}
.date-sep span{background:rgba(225,245,254,.92);color:#4a6b7a;padding:4px 12px;border-radius:8px;font-size:11.5px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.chat-bar{background:transparent;padding:6px 8px calc(8px + var(--safe-bottom));flex-shrink:0;position:relative}
.chat-input-row{display:flex;align-items:flex-end;gap:6px}
.chat-field{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:22px;outline:none;font-size:15px;font-family:inherit;direction:rtl;max-height:110px;min-height:42px;padding:10px 16px;resize:none;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chat-send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(37,211,102,.4);padding-right:2px}
.chat-emoji-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--bg2);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sender-row{display:flex;gap:4px;margin-bottom:8px;background:var(--bg3);
  border-radius:14px;padding:4px;overflow-x:auto}
.sender-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:10px;border:none;cursor:pointer;
  font-size:12px;font-weight:700;background:transparent;color:var(--text2);transition:all .2s}
.sender-btn.active{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.quick-row{display:flex;gap:5px;overflow-x:auto;padding:6px 0;margin-bottom:6px;scrollbar-width:none}
.quick-chip{flex:0 0 auto;background:var(--primary)15;border:1.5px solid var(--primary)30;
  border-radius:20px;padding:5px 11px;cursor:pointer;font-size:11px;
  font-weight:600;color:var(--primary);white-space:nowrap}
.sb-logo{padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px}
.sb-logo-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.sb-nav{padding:8px}
.sb-nav-btn{display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border:none;border-radius:var(--radius);
  background:transparent;color:var(--text2);cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s;margin-bottom:2px;position:relative}
.sb-nav-btn:hover{background:var(--bg3);color:var(--text)}
.sb-nav-btn.active{background:rgba(108,99,255,.12);color:var(--primary)}
.sb-nav-btn .sb-icon{font-size:16px;flex-shrink:0}
.sb-children{padding:8px;flex:1;overflow-y:auto}
.sb-child-btn{display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border:2px solid transparent;border-radius:var(--radius);
  background:transparent;cursor:pointer;margin-bottom:4px;transition:all .2s}
.sb-child-btn:hover{background:var(--bg3)}
.sb-child-btn.active{background:var(--primary)12;border-color:var(--primary)40}
.sb-child-avatar{width:32px;height:32px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sb-child-name{font-size:12px;font-weight:700;color:var(--text);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-child-grade{font-size:10px;color:var(--text3)}
.tabs{display:flex;background:var(--bg3);padding:0 4px;flex-shrink:0;
  border-bottom:2px solid var(--border);overflow-x:auto}
.tab-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;border:none;background:transparent;cursor:pointer;
  color:var(--text3);font-size:13px;font-weight:600;transition:all .2s;
  border-bottom:3px solid transparent;position:relative}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:rgba(108,99,255,.06)}
.tab-btn .tab-icon{font-size:16px;line-height:1}
.tab-btn .tab-label{font-size:9px;font-weight:700;white-space:nowrap}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);
  color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:700;
  z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;
  animation:toastIn .3s ease}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.confirm-box{background:var(--bg2);border-radius:var(--radius-lg);padding:24px;
  max-width:300px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-screen{min-height:100%;height:auto;display:flex;flex-direction:column;background:linear-gradient(135deg,#1a1a2e 0%,var(--primary) 100%);align-items:center;justify-content:flex-start;padding:24px;padding-top:calc(24px + var(--safe-top));padding-bottom:calc(40px + var(--safe-bottom));overflow-y:auto}
.login-box{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-lg);
  padding:32px 24px;width:100%;max-width:360px}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 8px;
  text-align:center;border-top:3px solid transparent;box-shadow:var(--card-shadow)}
.stat-val{font-size:20px;font-weight:900;line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px}
.sec-title{font-size:11px;font-weight:800;color:var(--text3);
  margin-bottom:8px;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}
.child-hdr{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:calc(12px + var(--safe-top));padding-left:14px;padding-right:14px;padding-bottom:14px;flex-shrink:0}
.child-hdr-emoji{font-size:36px;margin-top:4px}
.child-hdr-name{color:#fff;font-size:18px;font-weight:900}
.child-hdr-grade{color:rgba(255,255,255,.75);font-size:12px}
.child-hdr-pills{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}
.ptr-bar{position:fixed;top:0;left:0;right:0;height:0;background:var(--primary);
  transition:height .2s;z-index:9990;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:13px;font-weight:700;overflow:hidden}
.emoji-picker{position:absolute;bottom:60px;left:8px;right:8px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:1000;max-height:200px;overflow-y:auto}
.e-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:5px;border-radius:8px}
.e-btn:hover{background:var(--bg3)}
.notif-badge{position:absolute;top:-2px;right:-4px;background:var(--secondary);
  color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:900;
  border:2px solid var(--bg2);pointer-events:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ai-card{background:linear-gradient(135deg,#1a1a2e,#2d1b69);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;color:#fff;border:1px solid rgba(108,99,255,.3)}
.ai-badge{background:rgba(108,99,255,.3);color:#a78bfa;padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:8px}
.quote-box{padding:16px 18px;background:linear-gradient(135deg,rgba(108,99,255,.13),rgba(168,85,247,.08));border-bottom:1px solid var(--border);position:relative}
.quote-box .quote-mark{position:absolute;top:2px;right:14px;font-size:42px;color:rgba(108,99,255,.18);font-weight:900;line-height:1;font-family:Georgia,serif}
.quote-box .quote-text{font-size:18px;font-weight:800;color:var(--text);line-height:1.6;text-align:center;padding:0 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:600;position:relative;transition:all .15s}
.cal-day:hover{background:var(--bg3)}
.cal-day.today{background:var(--primary);color:#fff;font-weight:900}
.cal-day.has-event::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--secondary)}
.cal-day.today.has-event::after{background:#fff}
.cal-day.other-month{opacity:.3}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-header span{text-align:center;font-size:11px;font-weight:700;color:var(--text3);padding:4px 0}
.compare-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.compare-bar .bar-name{font-size:13px;font-weight:700;min-width:70px;text-align:right}
.compare-bar .bar-val{font-size:12px;font-weight:700;min-width:36px;text-align:left}
.reminder-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);background:var(--bg3);margin-bottom:8px}
@media print{
  .no-print,.sidebar,.desk-bar,.bottom-nav,.hdr .back-btn,.tabs,
  .btn-primary,.btn-sm,.btn-del,.btn-edit,.chat-bar,.sender-row,
  .quick-row,.sb-nav,.sb-children{display:none!important}
  body{overflow:auto!important;background:#fff!important;color:#000!important;direction:rtl}
  #app,.app-shell,.main,.screen{height:auto!important;overflow:visible!important;display:block!important}
  .scroll{overflow:visible!important;padding:10px!important;height:auto!important}
  .card,.card-grid{break-inside:avoid;margin-bottom:8px}
  .card-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px}
  .hdr{print-color-adjust:exact;-webkit-print-color-adjust:exact;border-radius:12px;margin-bottom:12px;padding:12px 16px!important}
  @page{margin:1.5cm;size:A4 portrait}
  .print-header{display:block!important;text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #6C63FF}
}
.print-header{display:none}
.msg-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
.msg-menu-sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:14px 10px calc(14px + var(--safe-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:slideUp .2s}
.msg-menu-btn{display:block;width:100%;text-align:right;background:none;border:none;padding:13px 16px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;border-radius:12px;font-family:inherit}
.msg-menu-btn:active{background:var(--bg3)}

  if(d.children&&d.children[0]){
    const nm={"أحمد":"Adam","سارة":"Jasmine","محمد":"Asser"};
    const gm={"الصف الرابع":"Primary 5","الصف السادس":"Primary 1","الصف الأول":"Pre KG"};

      d={...d,children:d.children.map(c=>({...c,name:nm[c.name]||c.name,grade:gm[c.grade]||c.grade}))};

let _lastHash="";
function hashData(d){
  try{return JSON.stringify(d).slice(0,200);}catch{return "";}
}
function migrateData(d){
  if(!d)return d;
  let _migrated=false;
  if(!d.parents||!Array.isArray(d.parents)||d.parents.length===0){
    _migrated=true;
    const ps=d.parentSettings||{};
    d.parents=[
      {id:"p1",name:ps.father||"الأب",grade:"الأب",color:"#6C63FF",emoji:ps.fatherAvatar||"👨",isParent:true},
      {id:"p2",name:ps.mother||"الأم",grade:"الأم",color:"#FF6584",emoji:ps.motherAvatar||"👩",isParent:true},
    ];
  }
  if(!d.features)d.features={};
  ["homework","exams","grades","teacherNotes","supplies","goals"].forEach(key=>{
    if(!d[key])d[key]={};
    d.parents.forEach(p=>{ if(!d[key][p.id])d[key][p.id]=[]; });
  });
  if(!d.points)d.points={};
  if(!d.schedule)d.schedule={};
  if(!d.studySchedule)d.studySchedule={};
  if(!d.allowance)d.allowance={};
  d.parents.forEach(p=>{
    if(!d.points[p.id])d.points[p.id]={total:0,history:[]};
    if(!d.schedule[p.id])d.schedule[p.id]={};
    if(!d.studySchedule[p.id])d.studySchedule[p.id]={};
    if(!d.allowance[p.id])d.allowance[p.id]={daily:0,balance:0,history:[]};
  });
  if(_migrated){ try{ setTimeout(()=>{ apiSave(d); },800); }catch(e){} }
  return d;
}
async function loadData(silent=false){
  try{
    if(!silent){ST.sync="syncing";render();}
    const d=await apiLoad();
    const newHash=hashData(d);
    const changed=newHash!==_lastHash;
    _lastHash=newHash;
    if(silent&&!changed&&ST.data){ ST.sync="synced"; syncDotRefresh(); updateAppBadge(); return; }
    if(changed||!ST.data){
      if(ST.data&&d.notifications){
        const oldIds=new Set((ST.data.notifications||[]).map(n=>n.id));
        const newNotifs=d.notifications.filter(n=>!oldIds.has(n.id));
        newNotifs.forEach(n=>{
          if("Notification" in window&&Notification.permission==="granted"){
            try{new Notification("🏠 بيتنا — "+n.title,{body:n.body||"",tag:String(n.id)});}catch(e){}
          }
        });
      }
      ST.data=migrateData(d);
      ST.lastPull=new Date();
    }
    ST.sync="synced";
    const onChat = ST.screen==="generalChat" || (ST.screen==="child" && ST.tab==="chat");
    const ae = document.activeElement;
    const editing = ae && (ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT");
    // Never tear down the DOM while the user is typing — it would close the keyboard
    if(silent && editing){ syncDotRefresh(); updateAppBadge(); return; }
    if(silent && onChat && changed){ refreshChatMessages(); syncDotRefresh(); updateAppBadge(); return; }
    render();
    if("Notification" in window&&Notification.permission==="default"){
      Notification.requestPermission();
    }
  }catch(e){
    if(!ST.data){
      restoreFromBackup();
      if(!ST.data){ST.data=migrateData(DEF);showToast("تعذر الاتصال — تم تحميل البيانات الافتراضية","warn");}
    }
    ST.sync="error";
    if(!silent)render();
  }
}

// Render message text with @mentions highlighted
function renderMsgText(text,allUsers){
  const frag=document.createDocumentFragment();
  const names=(allUsers||[]).map(u=>u.name).filter(Boolean);
  if(!names.length){frag.appendChild(document.createTextNode(text));return frag;}
  // Build regex of @name (longest first to match multi-word names)
  const sorted=[...names].sort((a,b)=>b.length-a.length).map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re=new RegExp("@("+sorted.join("|")+")","g");
  let last=0,m;
  while((m=re.exec(text))!==null){
    if(m.index>last)frag.appendChild(document.createTextNode(text.slice(last,m.index)));
    frag.appendChild(span({className:"mention-tag"},"@"+m[1]));
    last=m.index+m[0].length;
  }
  if(last<text.length)frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

    const overlay=div({className:"modal-overlay no-print",onclick:(e)=>{if(e.target===e.currentTarget)setState({confirm:null});}});
    const box=div({className:"modal-box"});
    box.appendChild(div({style:{fontSize:"16px",fontWeight:"700",marginBottom:"18px",textAlign:"center"}},cf.msg));
    const row=div({style:{display:"flex",gap:"10px"}});
    row.appendChild(btn({className:"btn-sm",style:{flex:1,padding:"12px"},onclick:()=>setState({confirm:null})},"إلغاء"));
    row.appendChild(btn({className:"btn-del",style:{flex:1,padding:"12px"},onclick:()=>{const fn=cf.fn;ST={...ST,confirm:null};render();if(fn)fn();}},"تأكيد"));
    box.appendChild(row);
    overlay.appendChild(box);
    app.appendChild(overlay);
  }
  // Restore focus + caret to keep the keyboard from closing mid-typing
  if(_fid){
    const ne=app.querySelector('[data-fid="'+_fid+'"]');
    if(ne){ try{ ne.focus({preventScroll:true}); if(_selS!=null&&ne.setSelectionRange)ne.setSelectionRange(_selS,_selE); }catch(e){} }
  }
  autoBackup();
  updateAppBadge();
}

// ═══════════════════════════════════════════════════════
// POLLING + REMINDERS
// ═══════════════════════════════════════════════════════
let _pollTimer=null;
function startPolling(){
  clearInterval(_pollTimer);
  _pollTimer=setInterval(()=>{ if(document.visibilityState==="visible")loadData(true); },20000);
}
function checkReminders(){
  try{
    if(!ST.data||!("Notification" in window)||Notification.permission!=="granted")return;
    const {children,homework,exams}=ST.data;
    const fired=JSON.parse(localStorage.getItem("baytna_fired")||"[]");
    const newFired=[...fired];
    (children||[]).forEach(c=>{
      (homework[c.id]||[]).filter(h=>!h.done&&h.due===todayStr).forEach(h=>{
        const key="hw-"+c.id+"-"+h.id+"-"+todayStr;
        if(!fired.includes(key)){try{new Notification("🏠 بيتنا — واجب اليوم",{body:c.name+": "+h.subject});}catch(e){}newFired.push(key);}
      });
      (exams[c.id]||[]).filter(e=>e.date===todayStr).forEach(e=>{
        const key="ex-"+c.id+"-"+e.id+"-"+todayStr;
        if(!fired.includes(key)){try{new Notification("🏠 بيتنا — اختبار اليوم",{body:c.name+": "+e.subject});}catch(e){}newFired.push(key);}
      });
    });
    localStorage.setItem("baytna_fired",JSON.stringify(newFired.slice(-200)));
  }catch(e){}
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
(function init(){
  // theme restore
  try{ const t=localStorage.getItem("baytna_theme"); if(t){ST.theme=t;document.documentElement.setAttribute("data-theme",t);} }catch(e){}
  // restore last user
  try{
    const uid=localStorage.getItem("currentUserId");
    if(uid){ const tryRestore=()=>{ const u=(ST.data?.users||[]).find(x=>String(x.id)===String(uid)); if(u){ST.currentUser=u;ST.screen="home";render();} }; setTimeout(tryRestore,1200); }
  }catch(e){}
  // PWA install prompt
  let deferredPrompt=null;
  window.addEventListener("beforeinstallprompt",(e)=>{e.preventDefault();deferredPrompt=e;});
  window._installApp=()=>{ if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;} };
  // first paint
  render();
  // load data
  loadData();
  // polling
  startPolling();
  // reminders
  checkReminders();
  setInterval(checkReminders,60*60*1000);
  // re-render on resize (mobile/desktop layout)
  let _rt=null;
  window.addEventListener("resize",()=>{clearTimeout(_rt);_rt=setTimeout(()=>render(),200);});
  // refresh when tab becomes visible
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible")loadData(true); });
})();
</script>
