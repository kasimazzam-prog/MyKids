<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#6C63FF"/>
<title>🏠 بيتنا</title>
<!-- Charts are built-in without CDN dependencies -->
<style>
/* ── CSS Variables ── */
:root{
  --primary:#6C63FF;--primary2:#a855f7;--secondary:#FF6584;
  --green:#00B894;--orange:#FA8231;--yellow:#FDCB6E;--blue:#0984E3;
  --bg:#F8F9FF;--bg2:#fff;--bg3:#f0f0f8;
  --text:#2d3436;--text2:#636e72;--text3:#b2bec3;
  --border:#eef0f5;--card-shadow:0 2px 16px rgba(0,0,0,.06);
  --radius:16px;--radius-sm:10px;--radius-lg:24px;
  --hdr-h:56px;--nav-h:58px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{--chat-bg:#0b141a;
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;
  --text:#e8e8f0;--text2:#a8a8c0;--text3:#606080;
  --border:#2a2a40;--card-shadow:0 2px 16px rgba(0,0,0,.3);
}

/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;direction:rtl;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s}
input,select,textarea,button{font-family:'Segoe UI',Tahoma,Arial,'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;direction:rtl;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── Layout ── */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.app-shell{display:flex;height:100%;overflow:hidden}
.sidebar{display:none;width:240px;min-width:240px;flex-shrink:0;
  height:100%;overflow:hidden;flex-direction:column;
  background:var(--bg2);border-left:1px solid var(--border);
  box-shadow:-2px 0 12px rgba(0,0,0,.08)}
.main{flex:1;display:flex;flex-direction:column;height:100%;overflow:hidden;min-width:0}
.screen{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100%}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 16px}

/* ── Desktop ── */
@media(min-width:900px){
  .sidebar{display:flex}
  .scroll{padding:20px 24px 40px}
  .mob-only{display:none!important}
  .bottom-nav{display:none!important}
}
@media(max-width:899px){
  .desk-only{display:none!important}
}

/* ── Top Header ── */
.hdr{display:flex;align-items:center;gap:10px;padding:var(--safe-top) 14px 0;
  height:calc(var(--hdr-h) + var(--safe-top));flex-shrink:0;position:relative;box-sizing:content-box}
.hdr-grad{background:linear-gradient(135deg,var(--primary),var(--primary2))}
.hdr-dark{background:linear-gradient(135deg,#1a1a2e,#2d1b69)}
.hdr-title{color:#fff;font-size:16px;font-weight:800;flex:1;text-align:center}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;
  border-radius:var(--radius-sm);padding:8px 14px;font-size:20px;font-weight:900;
  cursor:pointer;flex-shrink:0;line-height:1}

/* ── Desktop Top Bar ── */
.desk-bar{display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:52px;flex-shrink:0;background:var(--bg2);
  border-bottom:1px solid var(--border);gap:12px}
.desk-bar .breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text2)}
.desk-bar .breadcrumb .current{color:var(--text);font-weight:700}
.desk-bar .actions{display:flex;gap:8px;align-items:center}

/* ── Bottom Nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--border);padding:5px 0 var(--safe-bottom);z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;padding:5px 1px;color:var(--text3);font-size:8.5px;font-weight:600;position:relative;transition:color .2s;min-width:0}
.nav-item.active{color:var(--primary)}
.nav-item .nav-icon{font-size:18px;line-height:1}
.nav-badge{position:absolute;top:0;right:calc(50% - 16px);
  background:var(--secondary);color:#fff;border-radius:10px;
  padding:1px 5px;font-size:9px;font-weight:900;border:1.5px solid var(--bg2)}

/* ── Cards ── */
.card{background:var(--bg2);border-radius:var(--radius);padding:14px;
  margin-bottom:10px;box-shadow:var(--card-shadow);border:1px solid var(--border)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

/* ── Buttons ── */
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;border:none;border-radius:var(--radius);padding:13px;width:100%;
  font-size:14px;font-weight:700;cursor:pointer;
  box-shadow:0 4px 14px rgba(108,99,255,.4);transition:all .2s}
.btn-primary:active{transform:scale(.98)}
.btn-sm{background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s}
.btn-icon{background:var(--bg3);border:1.5px solid var(--border);color:var(--text);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.btn-del{background:#FEE2E2;border:1.5px solid #fecaca;color:#EF4444;
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}
.btn-edit{background:#EEF2FF;border:1.5px solid #c7d2fe;color:var(--primary);
  border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer;font-size:14px}

/* ── Form Fields ── */
.field-group{margin-bottom:12px}
.field-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px}
.field-input{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);
  outline:none;transition:border-color .2s;direction:rtl}
.field-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.field-textarea{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);
  outline:none;transition:border-color .2s;resize:none;font-family:inherit;direction:rtl}
.field-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.1)}
.field-select{width:100%;border:2px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;font-size:15px;background:var(--bg2);color:var(--text);outline:none}

/* ── Chips ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:2px solid var(--border);border-radius:20px;padding:6px 14px;
  cursor:pointer;font-size:13px;font-weight:600;background:var(--bg2);color:var(--text);
  transition:all .2s;white-space:nowrap}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Pills ── */
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;
  font-size:11px;font-weight:700}

/* ── Progress Bar ── */
.pbar{background:var(--bg3);border-radius:10px;overflow:hidden}
.pbar-fill{border-radius:10px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* ── Chat ── */
.chat-wrap{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:var(--chat-bg,#e5ddd5)}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.msg-row{display:flex;gap:6px;align-items:flex-end;margin-bottom:2px;padding:0 2px}
.msg-row.mine{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-bottom:2px}
.bubble-txt{display:inline}
.msg-bubble{padding:6px 9px 5px;font-size:14.5px;line-height:1.4;word-break:break-word;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.13);position:relative}
.msg-bubble.mine{background:#DCF8C6;color:#111;border-bottom-right-radius:3px}
.msg-bubble.theirs{background:var(--bg2);color:var(--text);border-bottom-left-radius:3px}
.msg-time{display:block;font-size:10px;color:#667;text-align:left;margin-top:1px;line-height:1;float:left;margin-right:8px}
.msg-name{font-size:10px;font-weight:700;opacity:.7;margin-bottom:2px}
.date-sep{align-self:center;margin:10px 0 6px}
.date-sep span{background:rgba(225,245,254,.92);color:#4a6b7a;padding:4px 12px;border-radius:8px;font-size:11.5px;font-weight:600;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.chat-bar{background:transparent;padding:6px 8px calc(8px + var(--safe-bottom));flex-shrink:0;position:relative}
.chat-input-row{display:flex;align-items:flex-end;gap:6px}
.chat-field{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:22px;outline:none;font-size:15px;font-family:inherit;direction:rtl;max-height:110px;min-height:42px;padding:10px 16px;resize:none;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chat-send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(37,211,102,.4);padding-right:2px}
.chat-emoji-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--bg2);font-size:20px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sender-row{display:flex;gap:4px;margin-bottom:8px;background:var(--bg3);
  border-radius:14px;padding:4px;overflow-x:auto}
.sender-btn{flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:10px;border:none;cursor:pointer;
  font-size:12px;font-weight:700;background:transparent;color:var(--text2);transition:all .2s}
.sender-btn.active{background:var(--bg2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.quick-row{display:flex;gap:5px;overflow-x:auto;padding:6px 0;margin-bottom:6px;scrollbar-width:none}
.quick-chip{flex:0 0 auto;background:var(--primary)15;border:1.5px solid var(--primary)30;
  border-radius:20px;padding:5px 11px;cursor:pointer;font-size:11px;
  font-weight:600;color:var(--primary);white-space:nowrap}

/* ── Sidebar ── */
.sb-logo{padding:16px;background:linear-gradient(135deg,var(--primary),var(--primary2));
  border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo-title{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px}
.sb-logo-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}
.sb-nav{padding:8px}
.sb-nav-btn{display:flex;align-items:center;gap:10px;width:100%;
  padding:10px 12px;border:none;border-radius:var(--radius);
  background:transparent;color:var(--text2);cursor:pointer;
  font-size:13px;font-weight:600;transition:all .2s;margin-bottom:2px;position:relative}
.sb-nav-btn:hover{background:var(--bg3);color:var(--text)}
.sb-nav-btn.active{background:rgba(108,99,255,.12);color:var(--primary)}
.sb-nav-btn .sb-icon{font-size:16px;flex-shrink:0}
.sb-children{padding:8px;flex:1;overflow-y:auto}
.sb-child-btn{display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border:2px solid transparent;border-radius:var(--radius);
  background:transparent;cursor:pointer;margin-bottom:4px;transition:all .2s}
.sb-child-btn:hover{background:var(--bg3)}
.sb-child-btn.active{background:var(--primary)12;border-color:var(--primary)40}
.sb-child-avatar{width:32px;height:32px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sb-child-name{font-size:12px;font-weight:700;color:var(--text);text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-child-grade{font-size:10px;color:var(--text3)}

/* ── Tabs ── */
.tabs{display:flex;background:var(--bg3);padding:0 4px;flex-shrink:0;
  border-bottom:2px solid var(--border);overflow-x:auto}
.tab-btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;border:none;background:transparent;cursor:pointer;
  color:var(--text3);font-size:13px;font-weight:600;transition:all .2s;
  border-bottom:3px solid transparent;position:relative}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);background:rgba(108,99,255,.06)}
.tab-btn .tab-icon{font-size:16px;line-height:1}
.tab-btn .tab-label{font-size:9px;font-weight:700;white-space:nowrap}

/* ── Toast ── */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);
  color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:700;
  z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);white-space:nowrap;
  animation:toastIn .3s ease}
@keyframes toastIn{from{transform:translateX(-50%) translateY(-20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* ── Confirm ── */
.confirm-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px}
.confirm-box{background:var(--bg2);border-radius:var(--radius-lg);padding:24px;
  max-width:300px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}

/* ── Login ── */
.login-screen{min-height:100%;height:auto;display:flex;flex-direction:column;background:linear-gradient(135deg,#1a1a2e 0%,var(--primary) 100%);align-items:center;justify-content:flex-start;padding:24px;padding-top:calc(24px + var(--safe-top));padding-bottom:calc(40px + var(--safe-bottom));overflow-y:auto}
.login-box{background:rgba(255,255,255,.08);backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-lg);
  padding:32px 24px;width:100%;max-width:360px}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border-radius:var(--radius);padding:12px 8px;
  text-align:center;border-top:3px solid transparent;box-shadow:var(--card-shadow)}
.stat-val{font-size:20px;font-weight:900;line-height:1}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:3px}

/* ── Section Title ── */
.sec-title{font-size:11px;font-weight:800;color:var(--text3);
  margin-bottom:8px;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}

/* ── Child Header ── */
.child-hdr{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:calc(12px + var(--safe-top));padding-left:14px;padding-right:14px;padding-bottom:14px;flex-shrink:0}
.child-hdr-emoji{font-size:36px;margin-top:4px}
.child-hdr-name{color:#fff;font-size:18px;font-weight:900}
.child-hdr-grade{color:rgba(255,255,255,.75);font-size:12px}
.child-hdr-pills{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;justify-content:center}

/* ── Pull to refresh indicator ── */
.ptr-bar{position:fixed;top:0;left:0;right:0;height:0;background:var(--primary);
  transition:height .2s;z-index:9990;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:13px;font-weight:700;overflow:hidden}

/* ── Emoji Picker ── */
.emoji-picker{position:absolute;bottom:60px;left:8px;right:8px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:1000;max-height:200px;overflow-y:auto}
.e-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:5px;border-radius:8px}
.e-btn:hover{background:var(--bg3)}

/* ── Notification badge ── */
.notif-badge{position:absolute;top:-2px;right:-4px;background:var(--secondary);
  color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:900;
  border:2px solid var(--bg2);pointer-events:none}

/* ── Swipe hint ── */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ── AI ── */
.ai-card{background:linear-gradient(135deg,#1a1a2e,#2d1b69);border-radius:var(--radius);
  padding:16px;margin-bottom:10px;color:#fff;border:1px solid rgba(108,99,255,.3)}
.ai-badge{background:rgba(108,99,255,.3);color:#a78bfa;padding:3px 10px;
  border-radius:20px;font-size:11px;font-weight:700;display:inline-block;margin-bottom:8px}

/* ── Calendar ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:600;position:relative;transition:all .15s}
.cal-day:hover{background:var(--bg3)}
.cal-day.today{background:var(--primary);color:#fff;font-weight:900}
.cal-day.has-event::after{content:"";position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--secondary)}
.cal-day.today.has-event::after{background:#fff}
.cal-day.other-month{opacity:.3}
.cal-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-header span{text-align:center;font-size:11px;font-weight:700;color:var(--text3);padding:4px 0}

/* ── Compare ── */
.compare-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.compare-bar .bar-name{font-size:13px;font-weight:700;min-width:70px;text-align:right}
.compare-bar .bar-val{font-size:12px;font-weight:700;min-width:36px;text-align:left}

/* ── Reminder ── */
.reminder-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius);background:var(--bg3);margin-bottom:8px}

/* ── Print PDF ── */
@media print{
  .no-print,.sidebar,.desk-bar,.bottom-nav,.hdr .back-btn,.tabs,
  .btn-primary,.btn-sm,.btn-del,.btn-edit,.chat-bar,.sender-row,
  .quick-row,.sb-nav,.sb-children{display:none!important}
  body{overflow:auto!important;background:#fff!important;color:#000!important;direction:rtl}
  #app,.app-shell,.main,.screen{height:auto!important;overflow:visible!important;display:block!important}
  .scroll{overflow:visible!important;padding:10px!important;height:auto!important}
  .card,.card-grid{break-inside:avoid;margin-bottom:8px}
  .card-grid{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px}
  .hdr{print-color-adjust:exact;-webkit-print-color-adjust:exact;border-radius:12px;margin-bottom:12px;padding:12px 16px!important}
  @page{margin:1.5cm;size:A4 portrait}
  .print-header{display:block!important;text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #6C63FF}
}
.print-header{display:none}

/* ── Print PDF ── */
/* ── Print ── */
@media print{
  .no-print,.sidebar,.desk-bar,.bottom-nav,.hdr .back-btn,.tabs,
  .btn-primary,.btn-sm,.btn-del,.btn-edit,.chat-bar,.sender-row,.quick-row{display:none!important}
  body{overflow:auto!important;background:#fff!important;color:#000!important}
  #app,.app-shell,.main,.screen{height:auto!important;overflow:visible!important;display:block!important}
  .scroll{overflow:visible!important;padding:0!important;height:auto!important}
  .card{box-shadow:none!important;border:1px solid #ddd!important;break-inside:avoid}
  @page{margin:1.5cm;size:A4 portrait}
}

/* Chat message menu + edit banner */
.msg-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s}
.msg-menu-sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:14px 10px calc(14px + var(--safe-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25);animation:slideUp .2s}
.msg-menu-btn{display:block;width:100%;text-align:right;background:none;border:none;padding:13px 16px;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;border-radius:12px;font-family:inherit}

async function apiLoad(){
  const r=await fetch(`https://api.jsonbin.io/v3/b/${CFG.BIN_ID}/latest`,{headers:{"X-Master-Key":CFG.API_KEY}});
  if(!r.ok)throw new Error("load failed");
  const j=await r.json();
  if(!j.record?.children)return DEF;
  let d=j.record;
  // Migration
  if(d.children&&d.children[0]){
    const nm={"أحمد":"Adam","سارة":"Jasmine","محمد":"Asser"};
    const gm={"الصف الرابع":"Primary 5","الصف السادس":"Primary 1","الصف الأول":"Pre KG"};
    if(nm[d.children[0].name]){
      d={...d,children:d.children.map(c=>({...c,name:nm[c.name]||c.name,grade:gm[c.grade]||c.grade}))};
    }
  }
  // Ensure users array exists
  if(!d.users)d={...d,users:DEF.users};
  // Ensure new fields
  if(!d.homeRequests)d={...d,homeRequests:DEF.homeRequests};
  if(!d.homePlans)d={...d,homePlans:DEF.homePlans};
  if(!d.generalChat)d={...d,generalChat:DEF.generalChat};
  if(!d.notifications)d={...d,notifications:DEF.notifications};
  if(!d.parentSettings)d={...d,parentSettings:DEF.parentSettings};
  if(!d.aiSuggestions)d={...d,aiSuggestions:[]};
  return d;
}

async function apiSave(data){
  await fetch(`https://api.jsonbin.io/v3/b/${CFG.BIN_ID}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":CFG.API_KEY},
    body:JSON.stringify(data)
  });
}

}

function upd(patch,notif){
  const d={...S().data,...patch};
  if(notif){
    const n={id:Date.now(),...notif,time:new Date().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"}),date:todayStr,read:false};
    d.notifications=[n,...(d.notifications||[])].slice(0,100);
    // Push via ntfy so other devices get notified even when app is closed
    sendNtfy(notif.title,notif.body,d);
  }
  save(d);
}

// ── ntfy.sh push notifications (free, no account) ──
function sendNtfy(title,body,data){
  try{
    const topic=(data?.ntfyTopic||S().data?.ntfyTopic||"").trim();
    if(!topic)return; // not configured
    const sender=S().currentUser?.name||"بيتنا";
    fetch("https://ntfy.sh/"+encodeURIComponent(topic),{
      method:"POST",
      headers:{
        "Title":encodeURIComponent("🏠 "+(title||"بيتنا")).replace(/%/g,"="), // ascii-safe attempt
        "Tags":"house",
        "Priority":"default"
      },
      body:(title?title+"\n":"")+(body||"")+"\n— "+sender
    }).catch(()=>{});
  }catch(e){}
}

let _lastHash="";
function hashData(d){
  try{return JSON.stringify(d).slice(0,200);}catch{return "";}
}

// Ensure loaded data has all newer fields (for users with old saved data)
function migrateData(d){
  if(!d)return d;
  let _migrated=false;
  // Add parents if missing
  if(!d.parents||!Array.isArray(d.parents)||d.parents.length===0){
    _migrated=true;
    const ps=d.parentSettings||{};
    d.parents=[
      {id:"p1",name:ps.father||"الأب",grade:"الأب",color:"#6C63FF",emoji:ps.fatherAvatar||"👨",isParent:true},
      {id:"p2",name:ps.mother||"الأم",grade:"الأم",color:"#FF6584",emoji:ps.motherAvatar||"👩",isParent:true},
    ];
  }
  // Ensure features object exists
  if(!d.features)d.features={};
  // Ensure data slots exist for parents (so their tabs work)
  ["homework","exams","grades","teacherNotes","supplies","goals"].forEach(key=>{
    if(!d[key])d[key]={};
    d.parents.forEach(p=>{ if(!d[key][p.id])d[key][p.id]=[]; });
  });
  if(!d.points)d.points={};
  if(!d.schedule)d.schedule={};
  if(!d.studySchedule)d.studySchedule={};
  if(!d.allowance)d.allowance={};
  d.parents.forEach(p=>{
    if(!d.points[p.id])d.points[p.id]={total:0,history:[]};
    if(!d.schedule[p.id])d.schedule[p.id]={};
    if(!d.studySchedule[p.id])d.studySchedule[p.id]={};
    if(!d.allowance[p.id])d.allowance[p.id]={daily:0,balance:0,history:[]};
  });
  // Ensure every child has a login user account
  if(!d.users)d.users=[];
  (d.children||[]).forEach((c,i)=>{
    const hasUser=d.users.some(u=>u.role==="child"&&u.childId===c.id);
    if(!hasUser){
      _migrated=true;
      const defaultPins=["0000","1111","2222","3333","4444","5555"];
      d.users.push({id:"u_child_"+c.id,name:c.name,avatar:c.emoji||"🧒",role:"child",childId:c.id,pin:defaultPins[i]||"0000",active:true});
    }
  });
  if(_migrated){ try{ setTimeout(()=>{ apiSave(d); },800); }catch(e){} }
  return d;
}

async function loadData(silent=false){
  try{
    if(!silent){ST.sync="syncing";render();}
    const d=await apiLoad();
    const newHash=hashData(d);
    const changed=newHash!==_lastHash;
    _lastHash=newHash;

    // Silent poll with NO changes → do nothing (prevents chat flicker/scroll jump)
    if(silent&&!changed&&ST.data){ ST.sync="synced"; syncDotRefresh(); updateAppBadge(); return; }

    if(changed||!ST.data){
      // Detect new notifications from other device
      if(ST.data&&d.notifications){
        const oldIds=new Set((ST.data.notifications||[]).map(n=>n.id));
        const newNotifs=d.notifications.filter(n=>!oldIds.has(n.id));
        newNotifs.forEach(n=>{
          if("Notification" in window&&Notification.permission==="granted"){
            try{new Notification("🏠 بيتنا — "+n.title,{body:n.body||"",tag:String(n.id)});}catch(e){}
          }
        });
      }
      ST.data=migrateData(d);
      ST.lastPull=new Date();
    }
    ST.sync="synced";

    // Don't yank the chat out from under the user while they're typing
    const onChat = ST.screen==="generalChat" || (ST.screen==="child" && ST.tab==="chat");
    const ae = document.activeElement;
    const typing = ae && (ae.classList&&ae.classList.contains("chat-field"));
    if(silent && onChat && typing){ syncDotRefresh(); return; }

    // On chat screen with a silent change, append only new messages instead of full re-render
    if(silent && onChat && changed){ refreshChatMessages(); syncDotRefresh(); updateAppBadge(); return; }

    render();
    if("Notification" in window&&Notification.permission==="default"){
      Notification.requestPermission();
    }
  }catch(e){
    if(!ST.data){
      restoreFromBackup();
      if(!ST.data){ST.data=migrateData(DEF);showToast("تعذر الاتصال — تم تحميل البيانات الافتراضية","warn");}
    }
    ST.sync="error";
    if(!silent)render();
  }
}

// Update just the sync indicator without re-rendering everything
function syncDotRefresh(){
  try{
    const dots=document.querySelectorAll("[data-syncdot]");
    dots.forEach(d=>{d.style.background=ST.sync==="synced"?"#00B894":ST.sync==="error"?"#FF6584":"#FDCB6E";});
  }catch(e){}
}

// Append new chat messages in place, preserving scroll position
function refreshChatMessages(){
  try{
    const onGeneral = ST.screen==="generalChat";
    const msgs = onGeneral ? (ST.data.generalChat||[])
      : ((ST.data.chatMessages||[]).filter(m=>m.childId===ST.child?.id||!m.childId));
    const area=document.querySelector(".chat-msgs");
    if(!area){render();return;}
    const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;
    const shown = area.querySelectorAll("[data-mid]").length;
    if(msgs.length===shown) return; // nothing new visible
    // Simplest safe approach: full re-render then restore scroll if user was at bottom
    const prevTop=area.scrollTop;
    render();
    const area2=document.querySelector(".chat-msgs");
    if(area2){ area2.scrollTop = atBottom ? area2.scrollHeight : prevTop; }
  }catch(e){ render(); }
}

function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else if(k==="innerHTML")e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  kids.flat(Infinity).forEach(k=>{
    if(k==null||k===false||k===undefined)return;
    e.appendChild(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);
  });
  return e;
}
const div=(a,...k)=>el("div",a,...k);
const btn=(a,...k)=>el("button",a,...k);
const span=(a,...k)=>el("span",a,...k);
const inp=(a)=>el("input",a);
const sel=(a,...opts)=>{const s=el("select",a);opts.flat().forEach(o=>s.appendChild(el("option",{value:o},o)));return s;};
const textarea=(a,...k)=>el("textarea",a,...k);

}

// Permission check
// Check if a feature/tab is enabled (default ON if undefined)
function feat(key){
  const f=S().data?.features||{};
  return f[key]!==false;
}

function can(action){
  const u=S().currentUser;
  if(!u)return false;
  // Per-user override: if editData explicitly disabled, block edits
  if(action==="edit"&&u.perms&&u.perms.editData===false)return false;
  if(u.role==="admin")return true;
  if(action==="view")return true;
  if(u.role==="parent")return["edit","chat","manage"].includes(action);
  if(u.role==="child")return action==="chat";
  return false;
}
// Check if current user is allowed to access a screen (per-user perms)
function userCanAccess(screenKey){
  const u=S().currentUser;
  if(!u)return false;
  if(u.role==="admin")return true; // admin always full access
  if(u.perms&&u.perms[screenKey]===false)return false;
  return true;
}
function isSelf(childId){
  const u=S().currentUser;
  return u?.role==="child"&&u?.childId===childId;
}
function canViewChild(childId){
  const u=S().currentUser;
  if(!u)return false;
  if(u.role==="admin"||u.role==="parent")return true;
  return u.childId===childId;
}

// Update the app icon badge (red number) — works on installed PWA where supported

  try{

    if("setAppBadge" in navigator){
      if(total>0)navigator.setAppBadge(total).catch(()=>{});
      else navigator.clearAppBadge().catch(()=>{});

// ═══════════════════════════════════════════════════════
// PROFESSIONAL CHAT BUILDER
// ═══════════════════════════════════════════════════════
function buildChat({msgs,allUsers,currentUserName,color,onSend,onEdit,onDelete,onSeen,quickActions,placeholder,focusId}){
  const wrap=div({className:"chat-wrap"});
  const msgArea=div({className:"chat-msgs"});

  if(!msgs.length){
    msgArea.appendChild(div({style:{margin:"auto",textAlign:"center",color:"var(--text3)",padding:"40px 20px"}},
      div({style:{fontSize:"44px",marginBottom:"8px"}},"💬"),
      div({style:{fontSize:"14px",fontWeight:"600"}},"لا توجد رسائل بعد"),
      div({style:{fontSize:"12px",marginTop:"4px"}},"اكتب أول رسالة 👇")
    ));
  }

  // Mark visible messages from others as seen by current user
  if(onSeen){
    const unseen=msgs.filter(m=>m.sender!==currentUserName&&!(m.seenBy||[]).includes(currentUserName));
    if(unseen.length){ setTimeout(()=>onSeen(unseen.map(m=>m.id)),400); }
  }

  let lastDate="",lastSender="";
  msgs.forEach((m)=>{
    if(m.date!==lastDate){
      lastDate=m.date;lastSender="";
      const lbl=m.date===todayStr?"اليوم":m.date;
      msgArea.appendChild(div({className:"date-sep"},span(null,lbl)));
    }
    const isMine=m.sender===currentUserName;
    const showName=!isMine&&m.sender!==lastSender;
    lastSender=m.sender;
    const u=allUsers.find(u2=>u2.name===m.sender);

    const row=div({className:"msg-row"+(isMine?" mine":""),"data-mid":String(m.id)});

    if(!isMine){
      const av=div({className:"msg-avatar",style:{
        background:(u?.color||color)+"22",
        visibility:showName?"visible":"hidden"
      }},showName?(u?.avatar||m.avatar||"👤"):"");
      row.appendChild(av);
    }

    const bWrap=div({style:{display:"flex",flexDirection:"column",maxWidth:"78%",alignItems:isMine?"flex-end":"flex-start"}});
    const bubble=div({className:"msg-bubble "+(isMine?"mine":"theirs")});

    if(showName){
      bubble.appendChild(div({style:{fontSize:"12px",fontWeight:"800",color:u?.color||color,marginBottom:"3px"}},m.sender));
    }
    if(m.childRef||m.childId){
      const c=(S().data?.children||[]).find(c2=>c2.id===(m.childRef||m.childId));
      if(c)bubble.appendChild(div({style:{fontSize:"11px",fontWeight:"700",opacity:".75",marginBottom:"3px",display:"flex",alignItems:"center",gap:"4px"}},c.emoji+" "+c.name));
    }

    const txtRow=div({className:"bubble-txt"});
    // Highlight @mentions
    const parts=String(m.text).split(/(@[\u0600-\u06FF\w]+)/g);
    parts.forEach(part=>{
      if(part.startsWith("@")){
        txtRow.appendChild(span({style:{color:isMine?"#075E54":color,fontWeight:"800",background:(isMine?"#075E54":color)+"18",borderRadius:"4px",padding:"0 3px"}},part));
      }else if(part){
        txtRow.appendChild(document.createTextNode(part));
      }
    });
    bubble.appendChild(txtRow);

    // Meta line: edited tag + time + read receipt
    const meta=div({style:{display:"flex",alignItems:"center",gap:"4px",justifyContent:"flex-end",marginTop:"1px"}});
    if(m.edited)meta.appendChild(span({style:{fontSize:"9px",opacity:".5",fontStyle:"italic"}},"معدّلة"));
    meta.appendChild(span({className:"msg-time"+(isMine?" mine":"")},m.time));
    if(isMine){
      // read receipt: how many OTHER users have seen
      const others=allUsers.filter(x=>x.name!==currentUserName).map(x=>x.name);
      const seenCount=(m.seenBy||[]).filter(n=>others.includes(n)).length;
      const allSeen=others.length>0&&seenCount>=others.length;
      meta.appendChild(span({style:{fontSize:"11px",color:allSeen?"#34B7F1":"#92a0a8",fontWeight:"700",lineHeight:"1"}},seenCount>0?"✓✓":"✓"));
    }
    bubble.appendChild(meta);

    // Long-press / right-click → actions menu (only for own messages or admins)
    const canManage=isMine||can("edit");
    if(canManage&&(onEdit||onDelete)){
      let pressTimer=null;
      const openMenu=(ev)=>{ ev.preventDefault(); showMsgMenu(m,isMine); };
      bubble.addEventListener("contextmenu",openMenu);
      bubble.addEventListener("touchstart",()=>{pressTimer=setTimeout(()=>showMsgMenu(m,isMine),500);},{passive:true});
      bubble.addEventListener("touchend",()=>clearTimeout(pressTimer));
      bubble.addEventListener("touchmove",()=>clearTimeout(pressTimer));
      bubble.style.cursor="pointer";
    }

    bWrap.appendChild(bubble);
    row.appendChild(bWrap);
    msgArea.appendChild(row);
  });

  wrap.appendChild(msgArea);

  // Actions menu
  function showMsgMenu(m,isMine){
    const old=document.querySelector(".msg-menu-overlay");if(old)old.remove();
    const overlay=div({className:"msg-menu-overlay",onclick:function(e){if(e.target===overlay)overlay.remove();}});
    const sheet=div({className:"msg-menu-sheet"});
    sheet.appendChild(div({style:{fontSize:"12px",color:"var(--text3)",padding:"4px 16px 10px",borderBottom:"1px solid var(--border)",maxWidth:"260px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",direction:"rtl"}},"💬 "+m.text));
    sheet.appendChild(btn({className:"msg-menu-btn",onclick:()=>{navigator.clipboard&&navigator.clipboard.writeText(m.text);showToast("📋 تم نسخ الرسالة","ok");overlay.remove();}},"📋 نسخ"));
    if(isMine&&onEdit)sheet.appendChild(btn({className:"msg-menu-btn",onclick:()=>{overlay.remove();startEdit(m);}},"✏️ تعديل"));
    if(onDelete)sheet.appendChild(btn({className:"msg-menu-btn",style:{color:"#FF6584"},onclick:()=>{overlay.remove();askDel("حذف هذه الرسالة؟",()=>onDelete(m.id));}},"🗑️ حذف"));
    sheet.appendChild(btn({className:"msg-menu-btn",style:{color:"var(--text3)"},onclick:()=>overlay.remove()},"إلغاء"));
    overlay.appendChild(sheet);
    document.body.appendChild(overlay);
  }

  // ── Input bar — WhatsApp style ──
  const bar=div({className:"chat-bar no-print"});
  let editingId=null;
  const editBanner=div({className:"edit-banner",style:{display:"none"}});
  bar.appendChild(editBanner);
  const inputRow=div({className:"chat-input-row"});

  const eBtn=btn({className:"chat-emoji-btn",onclick:(ev)=>{
    ev.stopPropagation();
    const old=document.querySelector(".emoji-picker");
    if(old){old.remove();return;}
    const picker=div({className:"emoji-picker"});
    ["😀","😂","🥰","😊","😍","🤗","😎","👍","👏","🙏","❤️","💪","✅","⭐","🎉","🔥","💯","📚","✏️","📝","🏆","🎯","💡","⏰","📅","🍕","🎮","⚽","🌟","😴","🤔","😅","😘","🥳","🤩","💐","🙌","🫶","📢","🔔","⚠️","🌙","☀️","🎂","🎈","👋"].forEach((em)=>{
      picker.appendChild(btn({className:"e-btn",onclick:(e)=>{e.stopPropagation();tf.value+=em;tf.dispatchEvent(new Event("input"));tf.focus();}},em));
    });
    bar.appendChild(picker);
    setTimeout(()=>document.addEventListener("click",function h(){if(picker.parentNode)picker.remove();document.removeEventListener("click",h);},{once:true}),10);
  }},"😊");
  // Mention button
  const mBtn=btn({className:"chat-emoji-btn",style:{fontSize:"18px",fontWeight:"800"},onclick:(ev)=>{
    ev.stopPropagation();
    const old=document.querySelector(".mention-picker");
    if(old){old.remove();return;}
    const picker=div({className:"emoji-picker mention-picker",style:{gridTemplateColumns:"1fr",maxHeight:"180px"}});
    allUsers.filter(u=>u.name!==currentUserName).forEach(u=>{
      picker.appendChild(btn({className:"e-btn",style:{fontSize:"14px",fontWeight:"700",display:"flex",alignItems:"center",gap:"8px",justifyContent:"flex-start",padding:"8px 12px",width:"100%"},onclick:(e)=>{e.stopPropagation();tf.value+=(tf.value&&!tf.value.endsWith(" ")?" ":"")+"@"+u.name+" ";tf.dispatchEvent(new Event("input"));tf.focus();picker.remove();}},(u.avatar||"👤")+" "+u.name));
    });
    bar.appendChild(picker);
    setTimeout(()=>document.addEventListener("click",function h(){if(picker.parentNode)picker.remove();document.removeEventListener("click",h);},{once:true}),10);
  }},"@");
  inputRow.appendChild(eBtn);
  inputRow.appendChild(mBtn);

  const tf=textarea({"data-fid":focusId||"chat",className:"chat-field",placeholder:placeholder||"رسالة",rows:1});
  tf.oninput=function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,110)+"px";};
  tf.onkeydown=(e)=>{if(e.key==="Enter"&&!e.shiftKey&&window.innerWidth>=900){e.preventDefault();send();}};
  inputRow.appendChild(tf);

  const sendBtn=btn({className:"chat-send",onclick:()=>send()},"➤");
  inputRow.appendChild(sendBtn);
  bar.appendChild(inputRow);
  wrap.appendChild(bar);

  function startEdit(m){
    editingId=m.id;
    tf.value=m.text;
    tf.dispatchEvent(new Event("input"));
    tf.focus();
    editBanner.style.display="flex";
    editBanner.innerHTML="";
    editBanner.appendChild(span({style:{flex:1,fontSize:"12px",color:color,fontWeight:"700"}},"✏️ تعديل الرسالة"));
    editBanner.appendChild(btn({style:{background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontSize:"16px"},onclick:()=>cancelEdit()},"✕"));
  }
  function cancelEdit(){ editingId=null;tf.value="";tf.style.height="auto";editBanner.style.display="none"; }

  function send(){
    const t=(tf.value||"").trim();if(!t)return;
    if(editingId&&onEdit){ onEdit(editingId,t); cancelEdit(); return; }
    const now=new Date();
    const curU=allUsers.find(u=>u.name===currentUserName)||allUsers[0];
    onSend({text:t,childId:null,sender:curU.name,avatar:curU.avatar});
    tf.value="";tf.style.height="auto";tf.focus();
    setTimeout(()=>{msgArea.scrollTop=msgArea.scrollHeight;},80);
  }
  setTimeout(()=>{msgArea.scrollTop=msgArea.scrollHeight;},80);
  return wrap;
}

      (function(){

      if(linkedChild&&linkedChild.photo){
        return div({style:{width:"54px",height:"54px",borderRadius:"50%",overflow:"hidden",margin:"0 auto",border:"2px solid rgba(255,255,255,.4)"}},el("img",{src:linkedChild.photo,style:{width:"100%",height:"100%",objectFit:"cover"}}));
      }
      return div({style:{fontSize:"28px"}},u.avatar||"👤");
    })(),
      div({style:{fontSize:"13px",fontWeight:"700",color:"#fff"}},u.name),
      div({style:{fontSize:"10px",color:"rgba(255,255,255,.6)"}},ROLES[u.role]?.l||u.role)
    ));
  });

    box.appendChild(div({style:{marginBottom:"12px",textAlign:"center",color:"rgba(255,255,255,.8)",fontSize:"13px"}},"أدخل الرمز لـ "+S().selectedLoginUser.name));

    box.appendChild(pinRow);
    const pad=div({style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}});
    const updateDots=()=>{
      const ds=document.querySelectorAll("[data-pindot]");
      ds.forEach((d,i)=>{d.textContent=ST.pinInput.length>i?"●":"";});
      const errEl=document.querySelector("[data-pinerr]");
      if(errEl)errEl.textContent=ST.loginError||"";
    };
    [1,2,3,4,5,6,7,8,9,"",0,"⌫"].forEach(k=>{
      if(k===""){pad.appendChild(div());return;}
      pad.appendChild(btn({style:{background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.15)",borderRadius:"12px",padding:"14px",color:"#fff",fontSize:k==="⌫"?"20px":"22px",fontWeight:"700",cursor:"pointer"},onclick:()=>{
        if(k==="⌫"){ST.pinInput=ST.pinInput.slice(0,-1);ST.loginError="";}
        else if(ST.pinInput.length<4)ST.pinInput+=k;
        if(ST.pinInput.length===4){
          const u=ST.selectedLoginUser;
          if(ST.pinInput===(u.pin||"0000")){ST.currentUser=u;ST.pinInput="";ST.loginError="";ST.selectedLoginUser=null;try{localStorage.setItem("currentUserId",u.id);}catch(e){}try{if("Notification" in window&&Notification.permission==="default")Notification.requestPermission().then(()=>updateAppBadge());}catch(e){}setState({screen:"home"});return;}
          else{ST.loginError="الرمز خطأ، حاول مرة أخرى";ST.pinInput="";}
        }
        updateDots();
      }},String(k)));
    });
    box.appendChild(pad);
    box.appendChild(div({"data-pinerr":"1",style:{textAlign:"center",color:"#FF6584",fontSize:"13px",fontWeight:"700",marginTop:"10px",minHeight:"18px"}},loginError||""));
  }
  page.appendChild(box);
  return page;
}

// Build & download the ICS file
function exportCalendar(st,members){
  const data=S().data;
  const pad=n=>String(n).padStart(2,"0");
  const fmtDate=(dateStr)=>dateStr.replace(/-/g,"");
  const dtstamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  // Alarm trigger mapping
  const alarmMap={none:null,"1h":"-PT1H","3h":"-PT3H","18h":"-PT14H","1d":"-P1D","2d":"-P2D"};
  const trigger=alarmMap[st.alarm];
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Baytna//Family//AR\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\nX-WR-CALNAME:بيتنا\r\n";
  let n=0;
  function addEvent(uid,dateStr,title,desc){
    const dt=fmtDate(dateStr);
    ics+="BEGIN:VEVENT\r\n";
    ics+="UID:"+uid+"@baytna\r\n";
    ics+="DTSTAMP:"+dtstamp+"\r\n";
    ics+="DTSTART;VALUE=DATE:"+dt+"\r\n";
    ics+="SUMMARY:"+title.replace(/[,;\\]/g,"")+"\r\n";
    if(desc)ics+="DESCRIPTION:"+desc.replace(/[,;\\]/g,"")+"\r\n";
    if(trigger){
      ics+="BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:"+title.replace(/[,;\\]/g,"")+"\r\nTRIGGER:"+trigger+"\r\nEND:VALARM\r\n";
    }
    ics+="END:VEVENT\r\n";
    n++;
  }
  members.forEach(m=>{
    if(st.exams)(data.exams[m.id]||[]).forEach(ex=>addEvent("ex"+ex.id,ex.date,"📝 اختبار "+ex.subject+" — "+m.name,ex.notes||""));
    if(st.homework)(data.homework[m.id]||[]).filter(h=>!h.done).forEach(h=>addEvent("hw"+h.id,h.due,"✅ واجب "+h.subject+" — "+m.name,h.task||""));
    if(st.study)Object.entries(data.studySchedule[m.id]||{}).forEach(([day,sessions])=>{(sessions||[]).forEach(s=>{/* study sessions are weekly recurring - skip date-specific for simplicity */});});
  });
  if(st.events)(data.calendarEvents||[]).filter(e=>!e.childIds||!e.childIds.length||e.childIds.some(id=>st.members.includes(id))).forEach(ev=>addEvent("ev"+ev.id,ev.date,ev.title,ev.notes||""));
  ics+="END:VCALENDAR";
  if(n===0){showToast("لا توجد مواعيد للتصدير","error");return;}
  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="baytna-"+new Date().toISOString().split("T")[0]+".ics";
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
  showToast("✅ تم تصدير "+n+" موعد","ok");
}

// ── Photo Crop Screen ──
function screenCropPhoto(){
  const page=div({className:"screen"});
  page.appendChild(makeHdr("#1e3a5f","✂️ قص الصورة",backBtn(()=>setState({screen:S().cropReturn||"settings",screen2:null}))));
  const body=div({className:"scroll",style:{display:"flex",flexDirection:"column",alignItems:"center",padding:"20px 14px"}});
  body.appendChild(div({style:{fontSize:"13px",color:"var(--text3)",marginBottom:"14px",textAlign:"center"}},"اسحب الصورة لتحريكها، واستخدم الشريط للتكبير"));

  const BOX=280;
  // Crop viewport
  const viewport=div({style:{width:BOX+"px",height:BOX+"px",borderRadius:"50%",overflow:"hidden",position:"relative",background:"#000",boxShadow:"0 0 0 3px var(--primary), 0 8px 30px rgba(0,0,0,.3)",touchAction:"none",cursor:"grab"}});
  const imgEl=el("img",{src:S().cropSrc,style:{position:"absolute",userSelect:"none",pointerEvents:"none"}});
  viewport.appendChild(imgEl);
  body.appendChild(viewport);

  // State
  let natW=0,natH=0,baseScale=1;
  let zoom=S().cropZoom||1, tx=S().cropX||0, ty=S().cropY||0;

  function applyTransform(){
    const w=natW*baseScale*zoom, h=natH*baseScale*zoom;
    imgEl.style.width=w+"px";
    imgEl.style.height=h+"px";
    // clamp so image always covers the circle
    const minX=BOX-w, minY=BOX-h;
    tx=Math.min(0,Math.max(minX,tx));
    ty=Math.min(0,Math.max(minY,ty));
    imgEl.style.left=tx+"px";
    imgEl.style.top=ty+"px";
  }

  imgEl.onload=()=>{
    natW=imgEl.naturalWidth||imgEl.width;
    natH=imgEl.naturalHeight||imgEl.height;
    baseScale=Math.max(BOX/natW,BOX/natH); // cover
    // center
    const w=natW*baseScale*zoom, h=natH*baseScale*zoom;
    if(!S().cropX&&!S().cropY){tx=(BOX-w)/2;ty=(BOX-h)/2;}
    applyTransform();
  };
  // if cached
  if(imgEl.complete&&imgEl.naturalWidth){imgEl.onload();}

  // Drag handlers
  let dragging=false,sx=0,sy=0,stx=0,sty=0;
  function start(x,y){dragging=true;sx=x;sy=y;stx=tx;sty=ty;viewport.style.cursor="grabbing";}
  function move(x,y){if(!dragging)return;tx=stx+(x-sx);ty=sty+(y-sy);applyTransform();}
  function end(){dragging=false;viewport.style.cursor="grab";}
  viewport.addEventListener("mousedown",e=>{e.preventDefault();start(e.clientX,e.clientY);});
  window.addEventListener("mousemove",e=>move(e.clientX,e.clientY));
  window.addEventListener("mouseup",end);
  viewport.addEventListener("touchstart",e=>{const t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  viewport.addEventListener("touchmove",e=>{const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  viewport.addEventListener("touchend",end);

  // Zoom slider
  const zoomWrap=div({style:{width:BOX+"px",marginTop:"20px",display:"flex",alignItems:"center",gap:"10px"}});

// CHARTS — Pure SVG/CSS (no CDN)
// ═══════════════════════════════════════════════════════

function makeBarChart(data, dataKey, color, height=110){
  if(!data||!data.length) return div({style:{color:"var(--text3)",fontSize:"12px",padding:"8px"}},"لا توجد بيانات كافية");
  const W=320, H=height, pad={t:8,r:8,b:24,l:32};
  const vals=data.map(d=>Number(d[dataKey]||0));
  const maxV=Math.max(...vals,1);
  const bW=Math.floor((W-pad.l-pad.r)/data.length)-4;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("style","width:100%;height:"+H+"px;overflow:visible");

  // Y gridlines
  [0,25,50,75,100].forEach(v=>{
    if(v>maxV&&maxV<=100)return;
    const y=pad.t+(H-pad.t-pad.b)*(1-v/Math.max(maxV,100));
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",pad.l);line.setAttribute("x2",W-pad.r);
    line.setAttribute("y1",y);line.setAttribute("y2",y);
    line.setAttribute("stroke","rgba(0,0,0,.06)");line.setAttribute("stroke-dasharray","3,3");
    svg.appendChild(line);
    const lbl=document.createElementNS("http://www.w3.org/2000/svg","text");
    lbl.setAttribute("x",pad.l-3);lbl.setAttribute("y",y+3);
    lbl.setAttribute("text-anchor","end");lbl.setAttribute("font-size","8");lbl.setAttribute("fill","#b2bec3");
    lbl.textContent=v;svg.appendChild(lbl);
  });

  data.forEach((d,i)=>{
    const v=Number(d[dataKey]||0);
    const x=pad.l+i*(bW+4);
    const barH=Math.max(2,(H-pad.t-pad.b)*(v/Math.max(maxV,1)));
    const y=pad.t+(H-pad.t-pad.b)-barH;
    const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x",x);rect.setAttribute("y",y);
    rect.setAttribute("width",bW);rect.setAttribute("height",barH);
    rect.setAttribute("fill",color);rect.setAttribute("rx","3");
    svg.appendChild(rect);
    // Value label
    if(v>0){
      const vl=document.createElementNS("http://www.w3.org/2000/svg","text");
      vl.setAttribute("x",x+bW/2);vl.setAttribute("y",y-2);
      vl.setAttribute("text-anchor","middle");vl.setAttribute("font-size","8");vl.setAttribute("fill",color);vl.setAttribute("font-weight","700");
      vl.textContent=v+(maxV<=100?"%":"");svg.appendChild(vl);
    }
    // X label
    const xl=document.createElementNS("http://www.w3.org/2000/svg","text");
    xl.setAttribute("x",x+bW/2);xl.setAttribute("y",H-4);
    xl.setAttribute("text-anchor","middle");xl.setAttribute("font-size","8");xl.setAttribute("fill","#b2bec3");
    xl.textContent=(d.name||"").slice(0,5);svg.appendChild(xl);
  });
  const wrap=div({style:{width:"100%",overflowX:"auto"}});
  wrap.appendChild(svg);
  return wrap;
}

function makeLineChart(data, lines, height=120){
  if(!data||data.length<2) return div({style:{color:"var(--text3)",fontSize:"12px",padding:"8px"}},"تحتاج بيانات أكثر");
  const W=320, H=height, pad={t:12,r:12,b:24,l:32};
  const allVals=lines.flatMap(l=>data.map(d=>Number(d[l.key]||0)));
  const maxV=Math.max(...allVals,1);
  const minV=Math.max(0,Math.min(...allVals)-10);
  const xStep=(W-pad.l-pad.r)/(data.length-1);
  const yScale=v=>pad.t+(H-pad.t-pad.b)*(1-(v-minV)/(maxV-minV));
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("style","width:100%;height:"+H+"px");

  // Gridlines
  [0,25,50,75,100].filter(v=>v>=minV&&v<=maxV+10).forEach(v=>{
    const y=yScale(v);
    const gl=document.createElementNS("http://www.w3.org/2000/svg","line");
    gl.setAttribute("x1",pad.l);gl.setAttribute("x2",W-pad.r);gl.setAttribute("y1",y);gl.setAttribute("y2",y);

function screenGradeTrend(){
  const {data,child}=S();
  if(!child)return screenHome();

  const page=div({className:"screen"});
  page.appendChild(makeHdr(child.color,"📈 تطور درجات "+child.name,backBtn(()=>setState({screen:"child",tab:"grades"})),printBtn()));
  const body=div({className:"scroll"});

  if(cGr.length<2){
    body.appendChild(div({style:{textAlign:"center",padding:"60px 20px",color:"var(--text3)"}},
      div({style:{fontSize:"40px"}},"📊"),
      div({style:{fontWeight:"600",marginTop:"8px"}},"تحتاج على الأقل درجتين لعرض التطور")
    ));
    page.appendChild(body);return page;
  }

  // By subject - line chart
  const SUBJ=getSubjects();
  const subjData={};
  cGr.forEach(g=>{if(!subjData[g.subject])subjData[g.subject]=[];subjData[g.subject].push({date:g.date,pct:Math.round(g.score/g.max*100)});});

  // Overall trend - sorted by date
  const overallData=[...cGr]
    .sort((a,b)=>new Date(a.date)-new Date(b.date))
    .reduce((acc,g)=>{
      const existing=acc.find(x=>x.name===fmt(g.date));
      const pct=Math.round(g.score/g.max*100);
      if(existing){existing.avg=Math.round((existing.avg*existing.count+pct)/(existing.count+1));existing.count++;}
      else acc.push({name:fmt(g.date),avg:pct,count:1});
      return acc;
    },[]);
  // Add trend summary
  if(overallData.length>=2){
    const first=overallData[0].avg;const last=overallData[overallData.length-1].avg;
    const trend=last-first;
    body.appendChild(div({style:{background:trend>=0?"#D1FAE5":"#FEE2E2",borderRadius:"var(--radius)",padding:"12px 16px",marginBottom:"12px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      div(null,div({style:{fontWeight:"700",fontSize:"14px",color:trend>=0?"#00B894":"#FF6584"}},trend>=0?"📈 تحسن مستمر":"📉 يحتاج اهتماماً"),div({style:{fontSize:"12px",color:"var(--text2)",marginTop:"2px"}},"من "+first+"% إلى "+last+"%")),
      div({style:{fontSize:"28px",fontWeight:"900",color:trend>=0?"#00B894":"#FF6584"}},(trend>0?"+":"")+trend+"%")
    ));
  }

  body.appendChild(div({className:"card"},
    div({style:{fontWeight:"700",fontSize:"14px",color:"var(--text2)",marginBottom:"10px"}},"📈 المتوسط العام"),
    makeLineChart(overallData,[{key:"avg",color:child.color,name:"المتوسط"}])
  ));

  // Per subject
  Object.entries(subjData).forEach(([subj,pts])=>{
    if(pts.length<2)return;
    const chartData=pts.map(p=>({name:fmt(p.date),نتيجة:p.pct}));
    const avg=Math.round(pts.reduce((a,p)=>a+p.pct,0)/pts.length);
    const trend=pts[pts.length-1].pct-pts[0].pct;
    body.appendChild(div({className:"card"},
      div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
        div({style:{fontWeight:"700",fontSize:"14px"}},subj),
        div({style:{display:"flex",gap:"8px",alignItems:"center"}},
          span({style:{fontSize:"13px",fontWeight:"700",color:sc(avg)}},avg+"%"),
          span({style:{fontSize:"12px",color:trend>0?"#00B894":"#FF6584",fontWeight:"700"}},(trend>0?"↗ +":"↘ ")+trend+"%")
        )
      ),
      makeBarChart(chartData,"نتيجة",sc(avg))
    ));
  });

  page.appendChild(body);return page;
}

    ));
    bg.appendChild(box);app.appendChild(bg);
  }

  // Print header (shows only when printing)

    app.appendChild(div({style:{display:"flex",alignItems:"center",justifyContent:"center",height:"100%",flexDirection:"column",gap:"16px",background:"linear-gradient(135deg,#1a1a2e,#6C63FF)"}},

      )
    ));

  }

  // Login screen (no shell)
  if(screen==="login"){

    }catch(e){}

// ── Auto Backup (daily to localStorage) ──
function autoBackup(){
  try{
    const today=new Date().toISOString().split("T")[0];
    const lastBackup=localStorage.getItem("lastBackup");
    if(lastBackup===today||!ST.data)return;
    const backup={date:today,data:ST.data};
    localStorage.setItem("baytna_backup_"+today,JSON.stringify(backup));
    localStorage.setItem("lastBackup",today);
    // Keep only last 7 days
    for(let i=7;i<30;i++){
      const old=new Date();old.setDate(old.getDate()-i);
      const key="baytna_backup_"+old.toISOString().split("T")[0];
      if(localStorage.getItem(key))localStorage.removeItem(key);
    }
  }catch(e){}
}
setInterval(autoBackup,60000); // check every minute

// ── Restore from backup if no internet ──
function restoreFromBackup(){
  try{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("baytna_backup_")).sort().reverse();
    if(keys.length>0){
      const backup=JSON.parse(localStorage.getItem(keys[0])||"{}");
      if(backup.data?.children){
        ST.data=migrateData(backup.data);
        showToast("📦 تم تحميل النسخة الاحتياطية: "+backup.date,"warn");
        render();
      }
    }
  }catch(e){}
}

// ── Scheduled notification checker ──
function checkReminders(){
  if(!ST.data||Notification.permission!=="granted")return;
  const {children,homework={},exams={},calendarEvents=[]}=ST.data;
  const now=new Date();
  const todayS=now.toISOString().split("T")[0];
  const tomorrow=new Date(now);tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowS=tomorrow.toISOString().split("T")[0];

  // Check for due tomorrow items (send once per day)
  const alreadyNotified=new Set(JSON.parse(sessionStorage.getItem("notifiedIds")||"[]"));
  const newNotified=[];

  children.forEach(c=>{
    (homework[c.id]||[]).filter(h=>!h.done&&h.due===tomorrowS).forEach(h=>{
      const id="hw-"+h.id;
      if(!alreadyNotified.has(id)){
        try{new Notification("📚 واجب غداً — "+c.name,{body:h.subject+": "+h.task,tag:id});}catch(e){}
        newNotified.push(id);
      }
    });
    (exams[c.id]||[]).filter(e=>e.date===tomorrowS).forEach(e=>{
      const id="ex-"+e.id;
      if(!alreadyNotified.has(id)){
        try{new Notification("📝 اختبار غداً — "+c.name,{body:"اختبار "+e.subject,tag:id});}catch(e2){}
        newNotified.push(id);
      }
    });
  });

  if(newNotified.length>0){
    try{sessionStorage.setItem("notifiedIds",JSON.stringify([...alreadyNotified,...newNotified]));}catch(e){}
  }
}

let ptrY=null,ptrEl2=null;

  }
},{passive:true});
document.addEventListener("touchend",()=>{

},{passive:true});

// Swipe navigation between main screens
let swX=null,swY=null;
const SWIPE_SCREENS=["home","homeManage","generalChat","reports","notifications"];
document.addEventListener("touchstart",e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(swX===null)return;
  const dx=e.changedTouches[0].clientX-swX;
  const dy=Math.abs(e.changedTouches[0].clientY-swY);
  swX=null;swY=null;
  if(Math.abs(dx)<70||dy>50)return;
  const cur=S().screen;
  const idx=SWIPE_SCREENS.indexOf(cur);
  if(idx<0)return;
  if(dx>0&&idx>0)setState({screen:SWIPE_SCREENS[idx-1]});
  else if(dx<0&&idx<SWIPE_SCREENS.length-1)setState({screen:SWIPE_SCREENS[idx+1]});
},{passive:true});
