// ── JSONBin ──────────────────────────────
async function apiLoad() {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":API_KEY}});
  if(!r.ok) throw new Error("load failed");
  const j = await r.json();
  return (j.record && j.record.children) ? j.record : DEF;
}
async function apiSave(data) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},body:JSON.stringify(data)});
  if(!r.ok) throw new Error("save failed");
}

// ── UI ───────────────────────────────────
function Toast({msg,type,onDone}) {
  useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t);},[]);
  const bg=type==="error"?"#FF6584":type==="warn"?"#FDCB6E":"#00B894";
  return <div className="no-print" style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:bg,color:"#fff",padding:"11px 22px",borderRadius:22,fontSize:14,fontWeight:"700",zIndex:9999,boxShadow:"0 8px 24px rgba(0,0,0,0.25)",whiteSpace:"nowrap",animation:"slideDown 0.3s ease"}}>{msg}</div>;
}
function Confirm({msg,onYes,onNo}) {
  return <div className="no-print" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9998,padding:20}}>

      <div style={{fontSize:17,fontWeight:"800",color:"#2d3436",marginBottom:8}}>تأكيد الحذف</div>
      <div style={{fontSize:14,color:"#636e72",marginBottom:22,lineHeight:1.7}}>{msg}</div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={onNo} style={{flex:1,padding:"12px",borderRadius:14,border:"2px solid #eee",background:"#fff",color:"#636e72",fontWeight:"700",cursor:"pointer",fontSize:14}}>إلغاء</button>

      </div>
    </div>
  </div>;
}
function Pill({label,color,small}) {
  return <span style={{background:`${color}20`,color,padding:small?"2px 8px":"4px 12px",borderRadius:20,fontSize:small?10:12,fontWeight:"700",display:"inline-flex",alignItems:"center"}}>{label}</span>;
}
function PBar({value,max,color,h=8}) {
  const pct=max?Math.min(100,Math.round(value/max*100)):0;
  return <div style={{background:"rgba(0,0,0,0.07)",borderRadius:10,height:h,overflow:"hidden"}}>
    <div style={{background:color,height:h,borderRadius:10,width:`${pct}%`,transition:"width 0.7s cubic-bezier(.4,0,.2,1)"}}/>
  </div>;
}
function SyncDot({status,lastPull}) {
  const c=status==="synced"?"#00B894":status==="syncing"?"#FDCB6E":status==="error"?"#FF6584":"#a29bfe";
  const t=status==="synced"?"متزامن":status==="syncing"?"جاري المزامنة...":status==="error"?"خطأ في الاتصال":"جاري التحميل...";
  return <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"rgba(255,255,255,0.8)"}}>
    <span style={{width:7,height:7,borderRadius:"50%",background:c,display:"inline-block",boxShadow:`0 0 6px ${c}`,animation:status==="syncing"?"pulse 1s infinite":""}}/>

    try{
      setSync("syncing");

      setData(d);setLastPull(new Date());setSync("synced");
    }catch(e){

    try{await apiSave(nd);setSync("synced");setToast({msg:"تم الحفظ ✓",type:"ok"});}

    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:18,background:"linear-gradient(135deg,#1a1a2e 0%,#6C63FF 100%)"}}>

  );

  const upd=p=>save({...data,...p});

  const toggleHw=(cid,id)=>save({...data,homework:{...homework,[cid]:homework[cid].map(h=>h.id===id?{...h,done:!h.done}:h)}});
  const addSubj=(cid,day,s)=>{if(!s)return;const cs=schedule[cid]||{};upd({schedule:{...schedule,[cid]:{...cs,[day]:[...(cs[day]||[]),s]}}});setSchedSubj("");};
  const remSubj=(cid,day,i)=>{const cs=schedule[cid]||{};upd({schedule:{...schedule,[cid]:{...cs,[day]:cs[day].filter((_,x)=>x!==i)}}});};

  // ── COMPARE ──
  if(screen==="compare") return(
    <div style={S.page} className="page">

  // ── CHILD DETAIL ──
  if(screen==="child"&&child){

                  </div>

          {tab==="grades"&&<>
            <button style={S.addBtn(child.color)} onClick={()=>openAdd("fGrade",{subject:SUBJECTS[0],score:"",max:100,date:"",type:"اختبار"})}>+ إضافة درجة</button>
            {gBySubj.length>0&&<div style={S.card}>

              <ResponsiveContainer width="100%" height={140}><BarChart data={gBySubj} margin={{top:0,right:0,left:-28,bottom:0}}><CartesianGrid strokeDasharray="3 3" stroke="#f5f5f5"/><XAxis dataKey="s" tick={{fontSize:10}}/><YAxis domain={[0,100]} tick={{fontSize:10}}/><Tooltip formatter={v=>[`${v}%`]}/><Bar dataKey="a" fill={child.color} radius={[6,6,0,0]}/></BarChart></ResponsiveContainer>

            {!cGoals.length&&<div style={S.empty}>🎯<br/>لا توجد أهداف دراسية</div>}

                <div key={g.id} style={{...S.card,borderRight:`4px solid ${ok?"#00B894":child.color}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

              <div style={{flex:1,background:"#fff",borderRadius:20,padding:18,textAlign:"center",boxShadow:"0 4px 20px rgba(0,0,0,0.07)",borderTop:`4px solid ${child.color}`}}>
                <div style={{fontSize:11,color:"#b2bec3",letterSpacing:0.5}}>اليومي</div>
                <div style={{fontSize:28,fontWeight:"900",color:child.color,marginTop:4}}>{cAl.daily}<span style={{fontSize:14,opacity:0.7}}> ر.س</span></div>
              </div>
            </div>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <button style={{...S.addBtn("#00B894"),flex:1,marginBottom:0}} onClick={()=>openAdd("fAllowance",{type:"منح",amount:"",note:""})}>➕ منح</button>
              <button style={{...S.addBtn("#FF6584"),flex:1,marginBottom:0}} onClick={()=>openAdd("fAllowance",{type:"صرف",amount:"",note:""})}>➖ صرف</button>
              <button onClick={()=>openAdd("fAllowanceSettings",{daily:cAl.daily,balance:cAl.balance})} style={{background:"#f0f0f8",color:"#6C63FF",border:"none",borderRadius:14,padding:"0 16px",cursor:"pointer",fontWeight:"700",fontSize:16,flexShrink:0}}>⚙️</button>
            </div>
            {!cAl.history.length&&<div style={S.empty}>💰<br/>لا توجد معاملات بعد</div>}
            {cAl.history.map(h=>(
              <div key={h.id} style={{...S.card,display:"flex",alignItems:"center",gap:14}}>
                <div style={{width:48,height:48,borderRadius:16,background:h.amount>0?"#D1FAE5":"#FEE2E2",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:"900",color:h.amount>0?"#00B894":"#FF6584",fontSize:15,flexShrink:0}}>{h.amount>0?`+${h.amount}`:h.amount}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,color:"#2d3436",fontWeight:"600"}}>{h.note||h.type}</div>
                  <div style={{fontSize:12,color:"#b2bec3",marginTop:2}}>📅 {fmt(h.date)}</div>
                </div>
              </div>
            ))}
          </>}
          {tab==="supplies"&&<>
            <button style={S.addBtn(child.color)} onClick={()=>openAdd("fSupply",{name:"",priority:"medium"})}>+ إضافة مستلزم</button>
            {!cSup.length&&<div style={S.empty}>🛒<br/>القائمة فارغة</div>}
            {["high","medium","low"].map(pr=>{
              const items=cSup.filter(s=>s.priority===pr);
              if(!items.length)return null;
              const pInfo=PRIOR[pr];
              return(
                <div key={pr}>
                  <div style={{fontSize:12,fontWeight:"800",color:pInfo.color,marginTop:12,marginBottom:8,display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:pInfo.color,display:"inline-block"}}/>{pInfo.label}</div>
                  {items.map(s=>(
                    <div key={s.id} style={{...S.card,display:"flex",alignItems:"center",gap:12,opacity:s.done?0.6:1,transition:"opacity 0.3s"}}>
                      <button style={{width:28,height:28,borderRadius:8,border:`2.5px solid ${s.done?child.color:"#ddd"}`,background:s.done?child.color:"#fff",color:"#fff",fontWeight:"900",fontSize:14,cursor:"pointer",flexShrink:0,transition:"all 0.2s"}} onClick={()=>toggleSupply(child.id,s.id)}>{s.done?"✓":""}</button>
                      <div style={{flex:1,fontSize:14,color:"#2d3436",fontWeight:"600",textDecoration:s.done?"line-through":"none"}}>{s.name}</div>
                      <ED onEdit={()=>openEdit("fSupply",s,{name:s.name,priority:s.priority})} onDel={()=>upd({supplies:{...supplies,[child.id]:cSup.filter(x=>x.id!==s.id)}})} msg={`حذف "${s.name}"؟`}/>
                    </div>
                  ))}
                </div>
              );
            })}
          </>}
          {tab==="notes"&&<>
            <button style={S.addBtn(child.color)} onClick={()=>openAdd("fNote",{teacher:"",subject:SUBJECTS[0],note:"",type:"positive",date:""})}>+ إضافة ملاحظة</button>
            {!cNt.length&&<div style={S.empty}>💬<br/>لا توجد ملاحظات</div>}
            {[...cNt].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(nt=>{
              const ntI=NOTE_T[nt.type]||NOTE_T.academic;
              return(
                <div key={nt.id} style={{...S.card,borderRight:`4px solid ${ntI.color}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                        <Pill label={`${ntI.icon} ${ntI.label}`} color={ntI.color} small/>
                        <span style={{fontSize:12,color:"#b2bec3"}}>{nt.subject}</span>
                      </div>
                      <div style={{fontSize:14,color:"#2d3436",fontWeight:"500",lineHeight:1.7}}>{nt.note}</div>
                      <div style={{fontSize:12,color:"#b2bec3",marginTop:6}}>{nt.teacher} — 📅 {fmt(nt.date)}</div>
                    </div>
                    <ED onEdit={()=>openEdit("fNote",nt,{teacher:nt.teacher,subject:nt.subject,note:nt.note,type:nt.type,date:nt.date})} onDel={()=>upd({teacherNotes:{...teacherNotes,[child.id]:cNt.filter(n=>n.id!==nt.id)}})} msg="حذف هذه الملاحظة؟"/>
                  </div>
                </div>
              );
            })}
          </>}
        </div>
      </div>
    );
  }

  // ── HOME ─────────────────────────────────
  const upcoming=[...calendarEvents].sort((a,b)=>new Date(a.date)-new Date(b.date)).filter(e=>new Date(e.date)>=new Date());
  const todayDate=new Date().toLocaleDateString("ar-SA",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

  return(
    <div style={S.page} className="page">
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      {confirm&&<Confirm msg={confirm.msg} onYes={confirm.onYes} onNo={()=>setConfirm(null)}/>}
      <div style={{background:"linear-gradient(135deg,#1a1a2e 0%,#6C63FF 100%)",padding:"22px 16px 18px",position:"relative",overflow:"hidden",flexShrink:0}}>
        <div style={{position:"absolute",inset:0,backgroundImage:"radial-gradient(circle at 15% 50%, rgba(108,99,255,0.4) 0%, transparent 55%),radial-gradient(circle at 85% 20%, rgba(253,121,168,0.25) 0%, transparent 50%)"}}/>
        <div style={{position:"relative",zIndex:1}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontSize:24,fontWeight:"900",color:"#fff",letterSpacing:-1}}>📖 مدرستي</div>
              <div style={{color:"rgba(255,255,255,0.6)",fontSize:11,marginTop:3}}>{todayDate}</div>
              <div style={{marginTop:5}}><SyncDot status={sync} lastPull={lastPull}/></div>
            </div>
            <PrintBtn/>
          </div>
          {vacationMode.active&&<div style={{background:"rgba(253,203,110,0.18)",border:"1px solid rgba(253,203,110,0.4)",borderRadius:14,padding:"10px 14px",marginTop:12,fontSize:13,color:"#FDCB6E",fontWeight:"700",display:"flex",alignItems:"center",gap:8}}>
            🌙 وضع الإجازة نشط — العودة {fmt(vacationMode.until)}
            <button onClick={()=>upd({vacationMode:{active:false,until:""}})} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:8,padding:"3px 10px",cursor:"pointer",fontSize:12,marginRight:"auto"}}>إلغاء</button>
          </div>}
          <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
            {[["📚",Object.values(homework).flat().filter(h=>!h.done).length,"واجب متبقي"],["📝",Object.values(exams).flat().length,"اختبار"],["📅",upcoming.length,"حدث قادم"]].map((item,i)=>(
              <div key={i} style={{background:"rgba(255,255,255,0.12)",backdropFilter:"blur(10px)",padding:"6px 14px",borderRadius:20,fontSize:12,fontWeight:"700",color:"#fff",border:"1px solid rgba(255,255,255,0.1)"}}>{item[0]} {item[1]} {item[2]}</div>
            ))}
          </div>
        </div>
      </div>
      <div className="no-print" style={{padding:"10px 14px",background:"#fff",borderBottom:"1px solid #f0f0f0",flexShrink:0}}>
        <div style={{position:"relative"}}>
          <input style={{...S.finp,marginBottom:0,background:"#f5f6ff",paddingRight:42,fontSize:13,border:"2px solid #eef0ff"}} placeholder="🔍 ابحث في الواجبات والدرجات والمستلزمات..." value={search} onChange={e=>setSearch(e.target.value)}/>
          {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16,color:"#b2bec3",lineHeight:1}}>✕</button>}
        </div>
      </div>
      {search.trim().length>1&&(
        <div style={{background:"#fff",borderBottom:"2px solid #f0f0f0",maxHeight:250,overflowY:"auto",flexShrink:0}}>
          {!searchRes.length&&<div style={{padding:18,textAlign:"center",color:"#b2bec3",fontSize:13}}>لا نتائج لـ "{search}"</div>}
          {searchRes.map((r,i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 14px",borderBottom:"1px solid #fafafa",cursor:"pointer"}} onClick={()=>{setChild(r.child);setTab("homework");setScreen("child");setSearch("");}}>
              <div style={{width:38,height:38,borderRadius:12,background:`${r.child.color}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:17,flexShrink:0}}>{r.type}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:"#2d3436",fontWeight:"700"}}>{r.child.emoji} {r.main}</div>
                <div style={{fontSize:11,color:"#b2bec3",marginTop:1}}>{r.sub}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      <div className="no-print" style={{display:"flex",gap:8,padding:"10px 14px",background:"#fff",borderBottom:"1px solid #f0f0f0",overflowX:"auto",flexShrink:0}}>
        <button onClick={()=>setScreen("reports")} style={{background:"#EEF2FF",color:"#6C63FF",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:12,whiteSpace:"nowrap"}}>📄 التقارير</button>
        <button onClick={()=>setScreen("compare")} style={{background:"#F0FDF4",color:"#00B894",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:12,whiteSpace:"nowrap"}}>📊 مقارنة</button>
        <button onClick={()=>setScreen("settings")} style={{background:"#FFF7ED",color:"#FA8231",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:12,whiteSpace:"nowrap"}}>⚙️ الإعدادات</button>
        <button onClick={()=>openAdd("fEvent",{title:"",date:"",type:"holiday",childIds:[]})} style={{background:"#FAF5FF",color:"#A29BFE",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:12,whiteSpace:"nowrap"}}>📅 حدث</button>
        <button onClick={()=>{if(vacationMode.active){upd({vacationMode:{active:false,until:""}});}else{const d=window.prompt("تاريخ العودة (YYYY-MM-DD):");if(d)upd({vacationMode:{active:true,until:d}});}}} style={{background:vacationMode.active?"#FDCB6E":"#FFFBEB",color:vacationMode.active?"#fff":"#D97706",border:"none",borderRadius:12,padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:12,whiteSpace:"nowrap"}}>🌙 إجازة</button>
      </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 80px",WebkitOverflowScrolling:"touch"}}>
        <div style={S.sTitle}>أطفالي</div>
        {children.map(c=>{
          const pending=(homework[c.id]||[]).filter(h=>!h.done).length;
          const pts=points[c.id]?.total||0;
          const todaySubs=(schedule[c.id]||{})[todayName]||[];
          const todaySt=(studySchedule[c.id]||{})[todayName]||[];
          const avg=(()=>{const g=grades[c.id]||[];return g.length?Math.round(g.reduce((a,x)=>a+x.score/x.max*100,0)/g.length):null;})();
          const bal=allowance[c.id]?.balance||0;
          const hwDone=(homework[c.id]||[]).filter(h=>h.done).length;
          const hwTot=(homework[c.id]||[]).length;
          const needSup=(supplies[c.id]||[]).filter(s=>!s.done).length;
          return(
            <div key={c.id} style={{background:"#fff",borderRadius:24,marginBottom:14,overflow:"hidden",boxShadow:"0 4px 28px rgba(0,0,0,0.08)",cursor:"pointer",transition:"transform 0.15s, box-shadow 0.15s",WebkitTapHighlightColor:"transparent"}} onClick={()=>{setChild(c);setTab("schedule");setScreen("child");}}>
              <div style={{height:5,background:`linear-gradient(90deg,${c.color},${c.color}44)`}}/>
              <div style={{padding:"16px 18px"}}>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:56,height:56,borderRadius:20,background:`linear-gradient(135deg,${c.color},${c.color}77)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0,boxShadow:`0 4px 16px ${c.color}40`}}>{c.emoji}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:18,fontWeight:"900",color:"#2d3436"}}>{c.name}</div>
                    <div style={{fontSize:12,color:"#b2bec3",marginTop:1}}>{c.grade}</div>
                    {todaySubs.length>0&&<div style={{fontSize:11,color:"#b2bec3",marginTop:4,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>📅 {todaySubs.join(" • ")}</div>}
                    {todaySt.length>0&&<div style={{fontSize:11,color:c.color,marginTop:2,fontWeight:"600"}}>📚 {todaySt.map(s=>s.subject).join(" • ")}</div>}
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}}>
                    {pending>0&&<Pill label={`${pending} 📚`} color={c.color} small/>}
                    {needSup>0&&<Pill label={`🛒 ${needSup}`} color="#FF6584" small/>}
                    <span style={{color:c.color,fontSize:22,fontWeight:"900",lineHeight:1}}>←</span>
                  </div>
                </div>
                <div style={{marginTop:12}}>
                  <PBar value={hwDone} max={hwTot||1} color={c.color} h={6}/>
                  <div style={{display:"flex",gap:6,marginTop:9,flexWrap:"wrap"}}>
                    {avg&&<Pill label={`${avg}% 📊`} color={scoreColor(avg)} small/>}
                    <Pill label={`${pts} ⭐`} color={c.color} small/>
                    <Pill label={`${bal} ر.س 💰`} color="#00B894" small/>
                  </div>
                </div>
              </div>
            </div>
          );
        })}
        <div style={S.sTitle}>📅 أحداث قادمة</div>
        {upcoming.slice(0,4).map(ev=>{const et=EVENT_T[ev.type]||EVENT_T.activity;return(
          <div key={ev.id} style={{...S.card,display:"flex",gap:12,alignItems:"center",borderRight:`4px solid ${et.color}`}}>
            <div style={{width:46,height:46,borderRadius:14,background:`${et.color}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{et.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:"700",fontSize:14,color:"#2d3436"}}>{ev.title}</div>
              <div style={{fontSize:12,color:"#b2bec3",marginTop:2}}>📅 {fmt(ev.date)} — <span style={{color:et.color,fontWeight:"700"}}>{getDU(ev.date)}</span></div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <button onClick={e=>{e.stopPropagation();openEdit("fEvent",ev,{title:ev.title,date:ev.date,type:ev.type,childIds:ev.childIds||[]});}} style={{background:"#f0f0f8",border:"none",borderRadius:10,padding:"7px 11px",cursor:"pointer",fontSize:14,color:"#6C63FF"}}>✏️</button>
              <button onClick={e=>{e.stopPropagation();del(`حذف "${ev.title}"؟`,()=>upd({calendarEvents:calendarEvents.filter(x=>x.id!==ev.id)}));}} style={{background:"#FEE2E2",border:"none",borderRadius:10,padding:"7px 11px",cursor:"pointer",fontSize:14,color:"#EF4444"}}>🗑</button>
            </div>
          </div>
        );})}
        {!upcoming.length&&<div style={S.empty}>لا توجد أحداث قادمة</div>}
        <div style={S.sTitle}>⚠️ واجبات عاجلة اليوم</div>
        {children.map(c=>{
          const u=(homework[c.id]||[]).filter(h=>!h.done&&h.due<=todayStr);
          if(!u.length)return null;
          return(<div key={c.id} style={{background:"#fff",borderRadius:18,padding:"14px 16px",marginBottom:10,borderRight:`4px solid ${c.color}`,boxShadow:"0 2px 16px rgba(0,0,0,0.06)"}}>
            <div style={{fontWeight:"800",color:c.color,marginBottom:8,fontSize:15}}>{c.emoji} {c.name}</div>
            {u.map(h=><div key={h.id} style={{fontSize:13,color:"#636e72",padding:"3px 0",display:"flex",gap:6,alignItems:"center"}}><span style={{color:c.color,fontWeight:"900"}}>•</span><strong>{h.subject}:</strong> {h.task}</div>)}
          </div>);
        })}
        {children.every(c=>(homework[c.id]||[]).filter(h=>!h.done&&h.due<=todayStr).length===0)&&<div style={S.empty}>✨ ممتاز! لا توجد واجبات عاجلة اليوم</div>}
      </div>
    </div>
  );
}

// ── Styles ───────────────────────────────
const S={
  page:{fontFamily:"'Segoe UI',Tahoma,Arial,sans-serif",direction:"rtl",background:"#F8F9FF",height:"100vh",maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",overflow:"hidden"},
  hdr:c=>({background:`linear-gradient(135deg,${c},${c}cc)`,padding:"14px 16px",display:"flex",flexDirection:"row",alignItems:"center",justifyContent:"space-between",gap:8,flexShrink:0}),
  hTitle:{color:"#fff",fontSize:16,fontWeight:"800",flex:1,textAlign:"center"},
  backBtn:{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",borderRadius:12,padding:"8px 16px",fontSize:18,cursor:"pointer",flexShrink:0},
  card:{background:"#fff",borderRadius:20,padding:"14px",marginBottom:10,boxShadow:"0 2px 16px rgba(0,0,0,0.055)"},
  sTitle:{fontSize:11,fontWeight:"800",color:"#b2bec3",marginBottom:10,marginTop:6,letterSpacing:1.5,textTransform:"uppercase"},
  addBtn:c=>({background:c,color:"#fff",border:"none",borderRadius:16,padding:"14px",width:"100%",fontSize:14,fontWeight:"700",cursor:"pointer",marginBottom:12,boxShadow:`0 6px 22px ${c}40`,transition:"opacity 0.2s"}),
  submitBtn:c=>({background:`linear-gradient(135deg,${c},${c}bb)`,color:"#fff",border:"none",borderRadius:16,padding:"15px",width:"100%",fontSize:16,fontWeight:"900",cursor:"pointer",marginTop:12,boxShadow:`0 8px 28px ${c}42`,letterSpacing:0.5}),
  empty:{textAlign:"center",padding:"36px 16px",color:"#dfe6e9",fontSize:14,lineHeight:2.2},
  flbl:{fontSize:13,fontWeight:"700",color:"#636e72",marginBottom:7,marginTop:14},
  finp:{border:"2px solid #eef0f5",borderRadius:14,padding:"12px 14px",fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",fontFamily:"inherit",direction:"rtl",marginBottom:4,background:"#fff",transition:"border-color 0.2s"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
