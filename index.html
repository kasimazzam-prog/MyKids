// ── HTML Builders ──
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else if(k==="innerHTML")e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  kids.flat(Infinity).forEach(k=>{
    if(k==null||k===false)return;
    e.appendChild(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);
  });
  return e;
}

function buildTopBar(data){
  const {children,vacationMode}=data;
  const {screen,child}=S();
  const bar=div({className:"desktop-top-bar no-print"});
  
  // Breadcrumb
  const bread=div({style:{display:"flex",alignItems:"center",gap:"8px",color:"#636e72",fontSize:"14px"}});
  const screenNames={home:"الرئيسية",reports:"التقارير",settings:"الإعدادات",child:child?.name||"",fHw:"واجب",fExam:"اختبار",fGrade:"درجة",fNote:"ملاحظة",fStudy:"مذاكرة",fGoal:"هدف",fSupply:"مستلزم",fAllowance:"مصروف",fAllowanceSettings:"إعدادات المصروف",fPoints:"نقاط",fEvent:"حدث",addChild:"إضافة طفل",editChild:"تعديل بيانات"};
  if(child&&["child","fHw","fExam","fGrade","fNote","fStudy","fGoal","fSupply","fAllowance","fAllowanceSettings","fPoints"].includes(screen)){
    bread.appendChild(span({style:{cursor:"pointer",color:"#6C63FF"},onclick:()=>setState({screen:"home"})},"الرئيسية"));
    bread.appendChild(span(null,"›"));
    bread.appendChild(div({style:{width:"20px",height:"20px",borderRadius:"6px",background:`linear-gradient(135deg,${child.color},${child.color}88)`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px"}},child.emoji));
    bread.appendChild(span({style:{color:"#2d3436",fontWeight:"700"}},child.name));
    if(screen!=="child"){bread.appendChild(span(null,"›"));bread.appendChild(span({style:{color:"#2d3436",fontWeight:"700"}},screenNames[screen]||""));}
  } else {
    bread.appendChild(span({style:{color:"#2d3436",fontWeight:"700",fontSize:"16px"}},screenNames[screen]||"الرئيسية"));
  }
  bar.appendChild(bread);
  
  // Actions
  const actions=div({className:"no-print",style:{display:"flex",gap:"8px",alignItems:"center"}});
  actions.appendChild(btn({style:{background:"#f0f0f8",color:"#6C63FF",border:"none",borderRadius:"10px",padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:"13px"},onclick:printPDF},"🖨️ طباعة"));
  if(["child","fHw","fExam","fGrade","fNote","fStudy","fGoal","fSupply","fAllowance","fAllowanceSettings","fPoints"].includes(screen)){
    actions.appendChild(btn({style:{background:"#fff",color:"#636e72",border:"2px solid #eee",borderRadius:"10px",padding:"8px 16px",cursor:"pointer",fontWeight:"700",fontSize:"13px"},onclick:()=>setState({screen:"home"})},"← الرئيسية"));
  }
  bar.appendChild(actions);
  return bar;
}

// ── Render ──
function render(){
  const {data,sync,screen,toast,confirm}=S();
  const app=document.getElementById("app");
  app.innerHTML="";

  // Print header
  const printHeader=div({style:{display:"none"},className:"print-only"});

  // Toast
  if(toast){
    const t=div({className:"toast no-print",style:{background:toast.type==="error"?"#FF6584":toast.type==="warn"?"#FDCB6E":"#00B894"}},toast.msg);
    app.appendChild(t);
  }

  // Confirm dialog
  if(confirm){
    const bg=div({className:"confirm-bg no-print"});
    const box=div({className:"confirm-box"},
      div({style:{fontSize:"40px",marginBottom:"12px"}},"🗑️"),
      div({style:{fontSize:"17px",fontWeight:"800",color:"#2d3436",marginBottom:"8px"}},"تأكيد الحذف"),
      div({style:{fontSize:"14px",color:"#636e72",marginBottom:"22px",lineHeight:"1.7"}},confirm.msg),
      div({style:{display:"flex",gap:"10px"}},
        btn({style:{flex:1,padding:"12px",borderRadius:"14px",border:"2px solid #eee",background:"#fff",color:"#636e72",fontWeight:"700",cursor:"pointer",fontSize:"14px"},onclick:()=>setState({confirm:null})},"إلغاء"),
        btn({style:{flex:1,padding:"12px",borderRadius:"14px",border:"none",background:"linear-gradient(135deg,#FF6584,#ff4757)",color:"#fff",fontWeight:"700",cursor:"pointer",fontSize:"14px"},onclick:confirm.onYes},"حذف")
      )
    );
    bg.appendChild(box);app.appendChild(bg);
  }

  // Loading
  if(!data){app.appendChild(screenLoading());return;}

  // Build screen content
  const screens={
    home:screenHome,settings:screenSettings,reports:screenReports,child:screenChild,
    fHw:screenFHw,fExam:screenFExam,fGrade:screenFGrade,fNote:screenFNote,
    fStudy:screenFStudy,fGoal:screenFGoal,fSupply:screenFSupply,
    fAllowance:screenFAllowance,fAllowanceSettings:screenFAllowanceSettings,
    fPoints:screenFPoints,fEvent:screenFEvent,addChild:screenChildForm,editChild:screenChildForm
  };
  const fn=screens[screen]||screenHome;
  const screenEl=fn();

  const isDesktop=window.innerWidth>=900;
  
  if(isDesktop){
    const wrapper=div({className:"app-wrapper"});
    // Sidebar
    const sb=buildSidebar(data);
    wrapper.appendChild(sb);
    // Main panel
    const main=div({className:"main-panel"});
    main.appendChild(buildTopBar(data));
    main.appendChild(screenEl);
    wrapper.appendChild(main);
    app.appendChild(wrapper);
  } else {
    const wrapper=div({className:"app-wrapper"});
    wrapper.appendChild(screenEl);
    app.appendChild(wrapper);
  }
}

window.addEventListener("resize",()=>{render();});


// ── Init ──
loadData();
setInterval(loadData,20000);
</script>
</body>
