input,select,textarea,button{font-family:inherit;direction:rtl}

/* ── Mobile (default) ── */
.app-wrapper{display:flex;height:100vh;width:100%;background:#F8F9FF}
.sidebar{display:none}
.main-panel{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#F8F9FF}
.page{display:flex;flex-direction:column;height:100%;overflow:hidden}
.mobile-nav{display:flex;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0;overflow-x:auto;flex-shrink:0}

.children-grid{display:flex;flex-direction:column;gap:0}

/* ── Desktop ── */
@media(min-width:900px){

  .desktop-content{padding:24px!important}
  .card{border-radius:20px!important;margin-bottom:0!important}
  .scroll{padding:20px 24px 40px!important}
  .desktop-top-bar{display:flex!important}
}
@media(max-width:899px){

  ::-webkit-scrollbar{width:0}
}

  const r=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Master-Key":API_KEY}});
  if(!r.ok)throw new Error("load failed");
  const j=await r.json();
  return (j.record&&j.record.children)?j.record:DEF;
}
async function apiSave(data){
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},body:JSON.stringify(data)});
}

async function loadData(){
  try{
    setState({sync:"syncing"});
    const d=await apiLoad();
    setState({data:d,sync:"synced",lastPull:new Date()});
  }catch(e){
    if(!S().data)setState({data:DEF});
    setState({sync:"error"});
  }
}

async function saveData(newData){
  setState({sync:"syncing",data:newData});
  try{await apiSave(newData);setState({sync:"synced"});showToast("تم الحفظ ✓","ok");}
  catch{setState({sync:"error"});showToast("تعذرت المزامنة","error");}
}

function upd(patch,notifInfo){
  const newData={...S().data,...patch};
  if(notifInfo){
    const notif={id:Date.now(),...notifInfo,time:new Date().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"}),date:todayStr,read:false};
    newData.notifications=[notif,...(newData.notifications||[])].slice(0,50);
  }
  saveData(newData);
}

// ── HTML Builders ──
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else if(k==="innerHTML")e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  kids.flat(Infinity).forEach(k=>{
    if(k==null||k===false)return;
    e.appendChild(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);
  });
  return e;
}
function div(attrs,...kids){return el("div",attrs,...kids);}
function btn(attrs,...kids){return el("button",attrs,...kids);}
function inp(attrs){return el("input",attrs);}
function sel(attrs,...opts){const s=el("select",attrs);opts.flat().forEach(o=>s.appendChild(el("option",{value:o},o)));return s;}
function txt(attrs,...kids){return el("textarea",attrs,...kids);}
function span(attrs,...kids){return el("span",attrs,...kids);}
function pbar(value,max,color,h=8){
  const pct=max?Math.min(100,Math.round(value/max*100)):0;
  return div({className:"pbar-wrap",style:{height:h+"px"}},div({className:"pbar-fill",style:{background:color,height:h+"px",width:pct+"%"}}));
}
function pill(label,color,small){return span({className:"pill",style:{background:color+"20",color}},label);}
function syncDot(status,lastPull){
  const c=status==="synced"?"#00B894":status==="syncing"?"#FDCB6E":status==="error"?"#FF6584":"#a29bfe";
  const t=status==="synced"?"متزامن":status==="syncing"?"مزامنة...":status==="error"?"خطأ":"تحميل";
  const lp=lastPull&&status==="synced"?` • ${lastPull.toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})}`:"";
  return span({style:{display:"inline-flex",alignItems:"center",gap:"4px",fontSize:"11px",color:"rgba(255,255,255,.85)"}},
    span({style:{width:"7px",height:"7px",borderRadius:"50%",background:c,display:"inline-block"}}),
    t+lp
  );
}
function printBtn(){return btn({className:"no-print",style:{background:"rgba(255,255,255,.18)",border:"1px solid rgba(255,255,255,.3)",color:"#fff",borderRadius:"12px",padding:"7px 14px",cursor:"pointer",fontSize:"12px",fontWeight:"700"},onclick:()=>window.print()},"🖨️ طباعة");}
function makeHdr(color,...kids){
  const d=div({className:"hdr no-print",style:{background:`linear-gradient(135deg,${color},${color}cc)`}});
  kids.forEach(k=>k&&d.appendChild(k));
  return d;
}
function lbl(t){return div({className:"lbl"},t);}

function buildForm(title,color,backFn,submitFn,fieldsArr){
  const c=color||"#6C63FF";
  const page=div({className:"page"});
  const hdr=makeHdr(c,btn({className:"back-btn",onclick:backFn},"→"),span({style:{color:"#fff",fontSize:"16px",fontWeight:"800"}},title),printBtn());
  const body=div({style:{flex:1,overflowY:"auto",padding:"16px 16px 100px",WebkitOverflowScrolling:"touch"}});
  fieldsArr.forEach(f=>body.appendChild(f));
  body.appendChild(btn({className:"btn-sub",style:{background:`linear-gradient(135deg,${c},${c}bb)`,boxShadow:`0 6px 20px ${c}40`},onclick:submitFn},"✓ حفظ"));
  page.append(hdr,body);
  return page;
}

// ── Emoji Picker ──
function makeEmojiPicker(onSelect){
  const emojis="😀😂😍🥰😊🤗😎👍👏🙏❤️💪✅⭐🎉🔥💯📚✏️🧪📝🏆🎯💡⏰📅🍎🍕🎮⚽🎨🌟😴🤔😅😘🥳🤩💐🙌🫡🫶💬📢🔔⚠️🌙☀️🌈🎵🎶📱💻🖥️";
  const chars=[...emojis];
  let visible=false;
  
  const wrap=div({style:{position:"relative",display:"inline-block"}});
  const toggleBtn=btn({style:{background:"#f0f0f8",border:"2px solid #e0deff",borderRadius:"10px",padding:"8px 10px",cursor:"pointer",fontSize:"18px",lineHeight:"1",flexShrink:0},onclick:(e)=>{
    e.stopPropagation();
    visible=!visible;
    if(visible){
      const rect=toggleBtn.getBoundingClientRect();
      picker.style.left=Math.max(4,rect.left-100)+"px";
      picker.style.bottom=(window.innerHeight-rect.top+8)+"px";
    }
    picker.style.display=visible?"flex":"none";
  }},"😊");
  
  const picker=div({style:{display:"none",position:"fixed",bottom:"80px",left:"50px",background:"#fff",borderRadius:"16px",padding:"10px",boxShadow:"0 8px 32px rgba(0,0,0,.2)",zIndex:999,flexWrap:"wrap",gap:"4px",width:"220px",maxHeight:"160px",overflowY:"auto",border:"2px solid #f0f0f8"}});
  chars.forEach(em=>{
    picker.appendChild(btn({style:{background:"none",border:"none",fontSize:"20px",cursor:"pointer",padding:"4px",borderRadius:"8px",lineHeight:"1"},onclick:(e)=>{
      e.stopPropagation();
      onSelect(em);
      visible=false;
      picker.style.display="none";
    }},em));
  });
  
  document.addEventListener("click",()=>{visible=false;picker.style.display="none";},{once:false});
  wrap.append(toggleBtn,picker);
  return wrap;
}

// ── Render ──
function render(){
  const {data,sync,screen,toast,confirm}=S();
  const app=document.getElementById("app");
  app.innerHTML="";

  // Print header
  const printHeader=div({style:{display:"none"},className:"print-only"});

  // Toast
  if(toast){
    const t=div({className:"toast no-print",style:{background:toast.type==="error"?"#FF6584":toast.type==="warn"?"#FDCB6E":"#00B894"}},toast.msg);
    app.appendChild(t);
  }

  // Confirm dialog
  if(confirm){
    const bg=div({className:"confirm-bg no-print"});
    const box=div({className:"confirm-box"},
      div({style:{fontSize:"40px",marginBottom:"12px"}},"🗑️"),
      div({style:{fontSize:"17px",fontWeight:"800",color:"#2d3436",marginBottom:"8px"}},"تأكيد الحذف"),
      div({style:{fontSize:"14px",color:"#636e72",marginBottom:"22px",lineHeight:"1.7"}},confirm.msg),
      div({style:{display:"flex",gap:"10px"}},
        btn({style:{flex:1,padding:"12px",borderRadius:"14px",border:"2px solid #eee",background:"#fff",color:"#636e72",fontWeight:"700",cursor:"pointer",fontSize:"14px"},onclick:()=>setState({confirm:null})},"إلغاء"),
        btn({style:{flex:1,padding:"12px",borderRadius:"14px",border:"none",background:"linear-gradient(135deg,#FF6584,#ff4757)",color:"#fff",fontWeight:"700",cursor:"pointer",fontSize:"14px"},onclick:confirm.onYes},"حذف")
      )
    );
    bg.appendChild(box);app.appendChild(bg);
  }

  // Loading
  if(!data){app.appendChild(screenLoading());return;}

  // Build screen content
  const screens={
    home:screenHome,settings:screenSettings,reports:screenReports,child:screenChild,parentSetup:screenParentSetup,generalChat:screenGeneralChat,notifications:screenNotifications,homeManage:screenHomeManage,fHomeRequest:screenFHomeRequest,fHomePlan:screenFHomePlan,
    fHw:screenFHw,fExam:screenFExam,fGrade:screenFGrade,fNote:screenFNote,
    fStudy:screenFStudy,fGoal:screenFGoal,fSupply:screenFSupply,
    fAllowance:screenFAllowance,fAllowanceSettings:screenFAllowanceSettings,
    fPoints:screenFPoints,fEvent:screenFEvent,addChild:screenChildForm,editChild:screenChildForm
  };
  // Update subjects from data
  if(data&&data.customSubjects)SUBJECTS=data.customSubjects;
  
  const fn=screens[screen]||screenHome;
  const screenEl=fn();

  const isDesktop=window.innerWidth>=900;
  
  if(isDesktop){
    const wrapper=div({className:"app-wrapper"});
    // Sidebar
    const sb=buildSidebar(data);
    wrapper.appendChild(sb);
    // Main panel
    const main=div({className:"main-panel"});
    main.appendChild(buildTopBar(data));
    main.appendChild(screenEl);
    wrapper.appendChild(main);
    app.appendChild(wrapper);
  } else {
    const wrapper=div({className:"app-wrapper"});
    wrapper.appendChild(screenEl);
    app.appendChild(wrapper);
  }
}

window.addEventListener("resize",()=>{render();});

// ── Focus preservation - prevents keyboard disappearing ──
const _origRender=render;
render=function(){
  const ae=document.activeElement;
  const fid=ae&&ae.getAttribute?ae.getAttribute("data-fid"):null;
  const fval=ae?ae.value:"";
  const fss=ae&&ae.selectionStart!=null?ae.selectionStart:0;
  const fse=ae&&ae.selectionEnd!=null?ae.selectionEnd:0;
  _origRender();
  if(fid){
    const el2=document.querySelector('[data-fid="'+fid+'"]');
    if(el2){
      el2.focus();
      if(typeof fval==="string")el2.value=fval;
      try{el2.setSelectionRange(fss,fse);}catch(e){}
    }
  }
};
